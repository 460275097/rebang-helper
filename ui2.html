            <span style="font-size:11.5px;color:var(--sub)">${n} 个源</span>
            <button class="mini" data-show="${esc(c)}" style="padding:3px 10px">👁 恢复显示</button>
            <button class="mini danger" data-hdel="${esc(c)}" style="padding:3px 10px">🗑 删除</button></div>`;
        }).join(''):(!locHid?'<div style="color:var(--sub);font-size:12.5px;padding:8px 2px">目前没有隐藏的分类。</div>':''));
    card.querySelector('[data-x]').onclick=close;
    card.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{
      const c=b.dataset.show;
      setHiddenCat(c,false);
      const st=(state.cfg.settings=state.cfg.settings||{});
      const un=Array.isArray(st.unhideCats)?st.unhideCats:[];
      if(un.indexOf(c)<0) un.push(c);
      st.unhideCats=un;
      let on=0;
      if(c!=='本地'){ state.cfg.sources.forEach(s=>{ if(catHas(s,c)&&!s.enabled){ s.enabled=true; on++; } }); }
      saveCfg(); refreshCats(); renderCats(); renderSidebar(); render();
      if(typeof renderCM==='function') renderCM();
      toast('已恢复「'+c+'」'+(on?('，并开启 '+on+' 个源'):''));
      render();
    });
    card.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{
      const c=b.dataset.hdel;
      if(c==='本地'){ if(!confirm('删除「本地」分类？已设置的地区会被清空。')) return; clearRegion(); render(); return; }
      const n=state.cfg.sources.filter(s=>srcCat(s)===c).length;
      if(!confirm('删除分类「'+c+'」及里面的 '+n+' 个源？\n\n删除后该分类和这些源都不再出现在清单里、也不再抓取（可先用「导出源」留底）。')) return;
      state.cfg.sources=state.cfg.sources.filter(s=>srcCat(s)!==c);
      const st=(state.cfg.settings=state.cfg.settings||{});
      st.cats=(st.cats||[]).filter(x=>x!==c);
      st.hideCats=(st.hideCats||[]).filter(x=>x!==c);
      if(state.cat===c) state.cat='全部';
      if(state.view&&state.view!=='all'&&!state.cfg.sources.some(s=>s.id===state.view)) state.view='all';
      saveCfg(); refreshCats(); renderCats(); renderSidebar(); render();
      if(typeof renderCM==='function') renderCM();
      toast('已删除分类「'+c+'」及 '+n+' 个源');
      render();
    });
  };
  render();
  document.body.appendChild(ov);
}

function render(){
  const c=$('#content');
  const agg=state.view==='all';
  const isTop=state.cat==='__top', isRegion=state.cat==='__region';
  // 标题
  if(agg){ const cn=isTop?'（总排行）':(isRegion?'（本地）':(state.cat==='全部'?'':' · '+state.cat));
    $('#viewTitle').textContent='聚合'+cn;
    const ok=(isTop?enabled():enabledInCat()).filter(s=>((state.data[s.id]||{}).items||[]).length);
    const n=ok.reduce((a,s)=>a+(state.data[s.id].items.length),0);
    $('#viewSub').textContent=n?`${n} 条 · ${ok.length} 个源`:'';
  }else if(state.view==='fav'){ $('#viewTitle').textContent='我的收藏'; $('#viewSub').textContent=state.favs.length+' 条'; }
  else if(state.view==='hist'){ $('#viewTitle').textContent='浏览记录'; $('#viewSub').textContent=state.hist.length+' 条'; }
  else { const s=state.cfg.sources.find(x=>x.id===state.view);
    $('#viewTitle').textContent=s?s.name:''; const d=state.data[state.view]||{};
    $('#viewSub').textContent=d.ts?'更新于 '+fmtTime(d.ts):''; }
  const layBox=$('#segLayout');
  if(layBox) layBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.layout));
  const fitBtn=$('#btnFit');
  if(fitBtn) fitBtn.style.display=(state.layout==='board')?'':'none';
  c.classList.toggle('list-mode', state.layout==='list');
  $('#navAll').classList.toggle('on',state.view==='all');
  $('#navFav').classList.toggle('on',state.view==='fav');
  $('#navHist').classList.toggle('on',state.view==='hist');

  /* V8.0.4：单源视图顶栏加「修改新闻源 / 更多」——不用回设置页翻列表 */
  const _oldOps=$('#srcOps'); if(_oldOps) _oldOps.remove();
  const _curSrc=(!agg && state.view!=='fav' && state.view!=='hist')
      ? state.cfg.sources.find(x=>x.id===state.view) : null;
  if(_curSrc){
    const _o=el('div','srcops'); _o.id='srcOps';
    _o.innerHTML=`<button class="mini" data-e title="修改这个新闻源：校准提取规则">✎ 修改</button><button class="mini" data-m title="更多：浏览器打开该站首页">⋯ 更多</button>`;
    _o.querySelector('[data-e]').onclick=()=>{ try{ openCalib(_curSrc,()=>{ loadSources([_curSrc],true); render(); }); }catch(err){ toast('打不开校准界面：'+err.message); } };
    _o.querySelector('[data-m]').onclick=()=>openSourceSite(_curSrc);
    const _tb=document.querySelector('.topbar .tb-title');
    if(_tb) _tb.insertAdjacentElement('afterend',_o);
  }

  c.innerHTML='';
  const items=currentList();
  /* V8.0.8：修复「收藏点了没反应」——聚合/列表里的条目没有 _i，data-idx 变成 undefined，
     点星标时取不到对应新闻。渲染前统一按当前顺序编号。 */
  items.forEach((it,i)=>{ if(it) it._i=i; });
  /* V7.9.3：「推广」分类 → 推荐页（温情文案 + 可定制广告位） */
  if(state.cat==='推广'){ renderAd(c); return; }
  // V6.9：GitHub 简介懒翻译 + 整页标题翻译（异步，不阻塞渲染；完成后自动重渲染）
  setTimeout(()=>{ try{ translateGh(items); }catch(e){} },60);
  setTimeout(()=>{ try{ collectPageTr(items); }catch(e){} },120);
  setTimeout(()=>{ try{ collectTitleTr(items); }catch(e){} },180);

  // 失败源提示（V7.8：加「查看详情」展开完整清单）
  if(agg){
    /* V7.9：通知默认显示 10 秒后自动关闭（设置里 3~20 秒可调，0=不通知） */
    const _nsec=(()=>{ let n=parseInt(state.cfg.settings.notifySec,10); return isNaN(n)?10:Math.max(0,Math.min(20,n)); })();
    if(state.autoHidden&&state.autoHidden.length&&_nsec>0&&!state._notifyClosed&&(!state.autoHiddenAt||Date.now()-state.autoHiddenAt<=_nsec*1000)){
      const bar=el('div','err-bar',`<span>🛰 本次启动有 ${state.autoHidden.length} 个源没抓到数据，已自动隐藏：${esc(state.autoHidden.slice(0,4).map(h=>h.name).join('、'))}${state.autoHidden.length>4?' 等':''}</span><span class="eb-btns"><button class="eb-copy">复制</button><button class="eb-more">查看详情</button><button class="eb-retry">重试</button><button class="eb-x" title="关闭通知">✕</button></span>`);
      bar.querySelector('.eb-copy').onclick=()=>copyText(
        '本次启动抓取失败的源：\n'+state.autoHidden.map(h=>h.name+'：启动时没抓到数据').join('\n'));
      const rbtn=bar.querySelector('.eb-retry');
      rbtn.onclick=()=>{
        const list=state.cfg.sources.filter(s=>state.autoHidden.some(h=>h.id===s.id));
        if(!list.length) return toast('没有可重试的源');
        list.forEach(s=>{ s.enabled=true; });
        toast('正在重试 '+list.length+' 个源…'); loadSources(list,true);
      };
      const xbtn=bar.querySelector('.eb-x');
      if(xbtn) xbtn.onclick=()=>{ clearTimeout(state._ahT); state.autoHiddenAt=0; state._notifyClosed=true; state._errClosed=true;
        const nx=bar.nextElementSibling; if(nx&&nx.classList.contains('err-list')) nx.remove(); bar.remove(); };
      const mb=bar.querySelector('.eb-more');
      if(mb) mb.onclick=()=>{
        const old=bar.nextElementSibling;
        if(old && old.classList.contains('err-list')){ old.remove(); mb.textContent='查看详情'; return; }
        const p=el('div','err-list');
        p.innerHTML=state.autoHidden.map(h=>`<div class="er"><span class="en" title="${esc(h.name||'')}">${esc(h.name||'')}</span><span class="em">启动时没抓到数据，已自动隐藏</span></div>`).join('');
        c.insertBefore(p, bar.nextSibling);
        mb.textContent='收起 ▴';
      };
      c.appendChild(bar);
      clearTimeout(state._ahT);
      state._ahT=setTimeout(()=>{ if(!state._notifyClosed) render(); },_nsec*1000+100);   // 到时自动关闭
    }
    const errs=enabled().filter(s=>(state.data[s.id]||{}).error);
    /* M8.1：通知关闭（notifySec=0）时，这条粉色提示也不弹 */
    if(state.cfg.settings.showOnlyOk && errs.length && !state._errClosed && _nsec>0){
      const bar=el('div','err-bar',`<span>⚠ ${esc(errs.slice(0,4).map(s=>s.name).join('、'))}${errs.length>4?' 等':''} 暂时取不到数据，已自动隐藏</span><span class="eb-btns"><button class="eb-copy">复制</button><button class="eb-more">查看详情</button><button class="eb-retry">重试</button><button class="eb-x" title="关闭通知">✕</button></span>`);
      bar.querySelector('.eb-copy').onclick=()=>copyText(
        '抓取失败的源：\n'+errs.map(s=>s.name+'：'+String((state.data[s.id]||{}).error||'抓取失败')).join('\n'));
      bar.querySelector('.eb-retry').onclick=()=>{ state._errClosed=false; loadSources(errs,true); };
      /* V7.9.3：点 ✕ 记进本次运行状态——换分类/重渲染/自动刷新都不再弹 */
      bar.querySelector('.eb-x').onclick=()=>{ clearTimeout(state._ebT2); state._errClosed=true;
        const nx=bar.nextElementSibling; if(nx&&nx.classList.contains('err-list')) nx.remove(); bar.remove(); };
      const mb=bar.querySelector('.eb-more');
      if(mb) mb.onclick=()=>{
        const old=bar.nextElementSibling;
        if(old && old.classList.contains('err-list')){ old.remove(); mb.textContent='查看详情'; armClose(); return; }
        clearTimeout(state._ebT2);
        const p=el('div','err-list');
        p.innerHTML=errs.map(s=>{
          const msg=esc(String((state.data[s.id]||{}).error||'').slice(0,90));
          return `<div class="er"><span class="en" title="${esc(s.name)}">${esc(s.name)}</span><span class="em" title="${msg}">${msg||'抓取失败'}</span><button data-a="calib" data-id="${esc(s.id)}" title="校对：换地址或重新识别这个源">校对</button><button data-a="retry" data-id="${esc(s.id)}">重试</button><button data-a="hide" data-id="${esc(s.id)}">隐藏</button></div>`;
        }).join('');
        p.onclick=e=>{
          const b=e.target.closest('button'); if(!b) return;
          const src=state.cfg.sources.find(x=>x.id===b.dataset.id); if(!src) return;
          if(b.dataset.a==='calib'){ try{ openCalib(src, ()=>{ loadSources([src],true); render(); }); }
            catch(err){ toast('打不开校准界面：'+((err&&err.message)||err)); } }
          else if(b.dataset.a==='retry'){ loadSources([src],true); toast('正在重试「'+src.name+'」…'); }
          else{ src.enabled=false; saveCfg(); renderSidebar(); render();
            toast('已隐藏「'+src.name+'」，可在「设置 → 新闻源」重新打开'); }
        };
        c.insertBefore(p, bar.nextSibling);
        mb.textContent='收起 ▴';
      };
      c.appendChild(bar);
      /* V7.9：通知条默认 10 秒后自动关闭（展开详情时暂停计时，收起后重新计时） */
      const closeBar=()=>{ const nx=bar.nextElementSibling; if(nx&&nx.classList.contains('err-list')) nx.remove(); if(bar.parentNode) bar.remove(); };
      const armClose=()=>{ clearTimeout(state._ebT2); if(_nsec>0) state._ebT2=setTimeout(closeBar,_nsec*1000); };
      armClose();
    }
  }
  if(state.view==='fav'&&!items.length&&!state.filter){
    c.innerHTML='<div class="empty"><div class="big">⭐</div>还没有收藏<br>点新闻右侧的星标即可收藏</div>'; return;
  }
  if(state.view==='hist'&&!items.length&&!state.filter){
    c.innerHTML='<div class="empty"><div class="big">🕘</div>还没有浏览记录<br>点开任意新闻后会自动记录</div>'; return;
  }
  if(isRegion&&!items.length&&!state.filter){
    const set=state.cfg.settings.region||'';
    c.innerHTML=`<div class="empty"><div class="big">📍</div>${set
      ?('地区「'+esc(set)+'」暂时没抓到新闻，点右上角刷新试试')
      :'还没有设置地区<br>去「设置 → 通用 → 本地」填省份或城市，<br>如「广东」或「广东 广州」'}<br><br><button class="mini primary" id="goRegion">去设置地区</button></div>`;
    const g=$('#goRegion'); if(g) g.onclick=()=>openModal('general');
    return;
  }
  if(!items.length){
    if([...state.loading].length && agg && state.layout==='board' && !isTop && !isRegion){
      // 总览看板加载骨架：与看板同构
      c.innerHTML=`<div class="bgrid">${'<section class="bcard"><div class="bhead"><div class="skeleton" style="height:16px;width:62%;margin:0"></div></div><div class="bbody"><div class="skeleton" style="height:230px;border-radius:0;margin:0"></div></div></section>'.repeat(9)}</div>`;
    }
    else if([...state.loading].length) c.innerHTML=`<div class="grid">${'<div class="skeleton"></div>'.repeat(9)}</div>`;
    else c.innerHTML=`<div class="empty"><div class="big">🗂</div>${state.filter?'没有匹配“'+esc(state.filter)+'”的内容':'暂无内容，点右上角刷新'}</div>`;
    return;
  }
  // 总排行/地区/列表/无图 → 紧凑列表；聚合 → 总览看板；单源 → 原卡片
  if(state.layout==='list' || isTop || isRegion){
    const box=el('div','rows'); box.innerHTML=items.map(it=>rowHTML(it,agg)).join(''); c.appendChild(box);
    bind(c); return;
  }
  if(agg){
    // 总览看板：每个源一个独立面板，固定大小、内部滚动铺满；每源默认 10 条；搜索关键词同样过滤看板条目
    const bc=Math.max(1,Math.min(50,parseInt(state.cfg.settings.boardCount,10)||10));
    const g=el('div','bgrid');
    const srcs=enabledInCat().filter(s=>(state.data[s.id]||{items:[]}).items.some(match));
    g.innerHTML=srcs.map(s=>{
      const d=state.data[s.id]||{}; const fm=d.items.filter(match);
      const per=Math.min(bc,fm.length);
      return `<section class="bcard">
        <div class="bhead" data-sid="${esc(s.id)}" title="点击只看该源">
          <span class="bdot"></span><span class="bnm">${esc(s.name)}</span>
          <span class="bbadge">${esc(catLabel(s))}</span><span class="bcnt">${per} 条</span>
          <span class="bact"><button data-edit="${esc(s.id)}" title="修改新闻源：校准提取规则/地址">✎</button><button data-more="${esc(s.id)}" data-murl="${esc(srcHomeUrl(s))}" title="在浏览器打开「${esc(s.name)}」的网站">⋯</button></span></div>
        <div class="bbody">${fm.slice(0,per).map((it,i)=>`
        <div class="bitem" title="${esc(it.title)}" data-url="${esc(it.url)}" data-tt="${esc(it.title)}"
             data-src="${esc(s.name)}" data-ht="${esc(it.heatText||'')}">
          <span class="rk ${i<3?'t'+(i+1):''}">${i+1}</span>
          <span class="bt${tTrHTML(it)?' hast':''}">${trTitleHTML(it)}${tTrHTML(it)}</span>
          ${it.heatText?`<span class="bh">${esc(it.heatText)}</span>`:''}
        </div>`).join('') || '<div class="bempty">暂无内容</div>'}</div>
        <div class="bfoot" data-sid="${esc(s.id)}" title="查看该源全部新闻">浏览更多 →</div>
      </section>`;
    }).join('');
    c.appendChild(g);
    layoutBoard(g); bindBoardResize(g);
    /* V8.0.0 流畅度：整块看板只挂 2 个委托监听（原先每个条目单独绑定，120+ 面板 × 15 条要挂上千次） */
    g.onclick=e=>{
      /* V8.0.4：卡片右上角——✎ 就地修改新闻源（弹出校准界面），⋯ 更多（浏览器打开该站） */
      const ed=e.target.closest&&e.target.closest('[data-edit]');
      if(ed){
        const s=state.cfg.sources.find(x=>x.id===ed.dataset.edit);
        if(s){ try{ openCalib(s, ()=>{ loadSources([s],true); render(); }); }
               catch(err){ toast('打不开校准界面：'+err.message); } }
        return;
      }
      const mo=e.target.closest&&e.target.closest('[data-more]');
      if(mo){
        e.stopPropagation();
        const s=state.cfg.sources.find(x=>x.id===mo.dataset.more);
        /* V8.0.8：直接用该卡片渲染时算好的地址，保证「点哪个源就开哪个源」（新增源同样有效） */
        const u=mo.dataset.murl||(s?srcHomeUrl(s):'');
        if(!u){ toast('这个源没有可打开的地址'); return; }
        openInBrowser(u).then(ok=>{
          let host=''; try{ host=new URL(u).hostname; }catch(_e){}
          toast(ok?('已在浏览器打开 '+(s?s.name:host)):('打不开这个地址：'+u));
        });
        return;
      }
      const h=e.target.closest&&e.target.closest('.bhead,.bfoot');
      if(h&&h.dataset.sid){ state.view=h.dataset.sid; renderSidebar(); render(); return; }
      const n=e.target.closest&&e.target.closest('.bitem');
      if(n&&n.dataset.url){ pushHistory({title:n.dataset.tt,url:n.dataset.url,srcName:n.dataset.src,heatText:n.dataset.ht});
        window.open(n.dataset.url,'_blank'); }
    };
    g.oncontextmenu=e=>{ const n=e.target.closest&&e.target.closest('.bitem'); if(!n) return;
      e.preventDefault(); if(navigator.clipboard) navigator.clipboard.writeText(n.dataset.tt||'').then(()=>toast('已复制标题')); };
  }else{
    // 单源视图：紧凑列表（标题两行完整显示）
    const box=el('div','rows'); box.innerHTML=items.map(it=>rowHTML(it,false)).join(''); c.appendChild(box);
  }
  bind(c);
}

/* ---------------- V7.9.7：看板尺寸（列数 / 行数 / 拖边缘调宽高 / 一键自适应） ---------------- */
const BOARD_GAP=18;
function boardOpt(){
  const S=(state.cfg&&state.cfg.settings)||{};
  return {
    cols:Math.max(0,Math.min(12,parseInt(S.boardCols,10)||0)),
    rows:Math.max(1,Math.min(6,parseInt(S.boardRows,10)||2)),
    w:Math.max(0,parseInt(S.boardW,10)||0),
    h:Math.max(0,parseInt(S.boardH,10)||0)
  };
}
function boardAutoCols(g){
  const host=document.getElementById('content')||(g&&g.parentElement);
  const w=((host&&host.clientWidth)||window.innerWidth)-26;
  /* 每列至少给 240px，窗口越宽列越多，最多 12 列 */
  return Math.max(2,Math.min(12,Math.floor((w+BOARD_GAP)/(240+BOARD_GAP))));
}
function boardAvailH(g){
  const top=g.getBoundingClientRect().top;
  const pl=document.getElementById('player');
  const pb=(pl&&pl.classList.contains('on'))?66:0;
  return Math.max(260,window.innerHeight-top-22-pb);
}
/* 把列数、列宽、卡片高度应用到整块看板；尺寸统一，所以「调一个 = 全同步」 */
function layoutBoard(g){
  if(!g) return;
  const o=boardOpt();
  const cols=o.cols||boardAutoCols(g);
  g.style.setProperty('--bcols',cols);
  g.style.gridTemplateColumns=o.w?('repeat('+cols+','+o.w+'px)'):('repeat('+cols+',minmax(0,1fr))');
  let hh=o.h;
  if(!hh){
    hh=Math.floor((boardAvailH(g)-BOARD_GAP*(o.rows-1))/o.rows);
    hh=Math.max(180,Math.min(hh,1400));
  }
  g.style.setProperty('--bcardh',hh+'px');
}
/* 给每张卡片挂右侧（改宽）/ 底部（改高）拖拽条；拖动时所有板块一起变 */
function bindBoardResize(g){
  if(!g) return;
  g.querySelectorAll('.bcard').forEach(card=>{
    if(card.querySelector('.brz-r')) return;
    const r=document.createElement('span'); r.className='brz brz-r'; r.dataset.dir='r';
    const b=document.createElement('span'); b.className='brz brz-b'; b.dataset.dir='b';
    card.appendChild(r); card.appendChild(b);
  });
  if(g.dataset.rz) return;
  g.dataset.rz='1';
  g.addEventListener('mousedown',function(e){
    const hd=e.target.closest&&e.target.closest('.brz');
    if(!hd) return;
    e.preventDefault(); e.stopPropagation();
    const dir=hd.dataset.dir, card=hd.closest('.bcard');
    if(!card) return;
    const S=state.cfg.settings, r0=card.getBoundingClientRect();
    const cols=parseInt(g.style.getPropertyValue('--bcols'),10)||1;
    const x0=e.clientX, y0=e.clientY;
    const w0=Math.round(r0.width), h0=Math.round(r0.height);
    let lastW=w0, lastH=h0;
    document.body.classList.add('rb-resizing', dir==='r'?'col-resize':'row-resize');
    const mv=function(ev){
      if(dir==='r'){
        lastW=Math.max(200,Math.min(1400,Math.round(w0+(ev.clientX-x0))));
        g.style.gridTemplateColumns='repeat('+cols+','+lastW+'px)';
      }else{
        lastH=Math.max(160,Math.min(1600,Math.round(h0+(ev.clientY-y0))));
        g.style.setProperty('--bcardh',lastH+'px');
      }
    };
    const up=function(){
      document.removeEventListener('mousemove',mv);
      document.removeEventListener('mouseup',up);
      document.body.classList.remove('rb-resizing','col-resize','row-resize');
      if(Math.abs((dir==='r'?lastW-w0:lastH-h0))<3) return;   /* 只是点了一下，不保存 */
      if(dir==='r') S.boardW=lastW; else S.boardH=lastH;
      saveCfg();
      toast((dir==='r'?('列宽 '):('高度 '))+ (dir==='r'?lastW:lastH) +'px，所有板块已同步');
    };
    document.addEventListener('mousemove',mv);
    document.addEventListener('mouseup',up);
  });
  /* 双击卡片标题栏 = 该板块单独铺满（再双击还原） */
  g.querySelectorAll('.bhead').forEach(h=>{
    h.addEventListener('dblclick',function(ev){
      ev.stopPropagation();
      const card=h.closest('.bcard'); if(!card) return;
      const solo=card.classList.toggle('bsolo');
      g.classList.toggle('has-solo',solo);
      if(solo){
        card.style.setProperty('--bcardh',(boardAvailH(g))+'px');
        card.style.gridColumn='1 / -1';
      }else{
        card.style.removeProperty('--bcardh');
        card.style.removeProperty('grid-column');
        layoutBoard(g);
      }
    });
  });
}

/* ---------------- 朗读 ---------------- */
const sp=state.speak;
/* 安卓 App 内用原生 TTS 桥（WebView 不带 speechSynthesis）；浏览器走 Web Speech */
const hasNativeTts=()=>!!(window.RebangNative&&window.RebangNative.speak);
function updateSpeakUI(){
  if(sp.i>=sp.list.length) return;
  const it=sp.list[sp.i];
  $('#pTxt').textContent= it._board
    ? '('+it.srcName+' '+it._no+'/'+it._cnt+') '+it.title
    : '('+(sp.i+1)+'/'+sp.list.length+') '+it.title;
  highlightSpeaking(it);
}
function highlightSpeaking(it){
  document.querySelectorAll('.speaking').forEach(n=>n.classList.remove('speaking'));
  let n=document.querySelector(`[data-idx="${it._i}"]`);
  if(!n&&it._board){   // 看板条目没有 data-idx，按 标题+源名 定位面板里的行
    document.querySelectorAll('.bitem').forEach(b=>{
      if(!n&&b.dataset.tt===it.title&&b.dataset.src===it.srcName) n=b;
    });
  }
  if(n){ n.classList.add('speaking'); n.scrollIntoView({block:'center',behavior:'smooth'}); }
}
const ttsRate=()=>parseFloat(state.cfg.settings.ttsRate||1.25);
function speakText(text){
  sp._lastText=text;
  /* 第一优先：原生壳 TTS（安卓 App） */
  if(hasNativeTts() && window._nativeDead!==true){
    let ok=false;
    try{ ok=window.RebangNative.speak(text, String(sp.i), ttsRate())===true; }catch(e){}
    if(ok){ sp._native=true; return; }
    window._nativeDead=true;
  }
  sp._native=false;
  /* 桌面壳(WebView2)的 Web Speech 只触发事件不出声 → 优先用本机后端系统语音(SAPI/在线语音)真正发声 */
  if(window._btts!==false){ btSpeak(text); return; }
  onlineAudio(text);
}
window._nativeTtsState=ok=>{
  if(!ok){
    window._nativeDead=true;
    if(sp.on && sp._native){ sp._native=false; toast('本机无语音引擎，改用在线朗读'); onlineAudio(sp._lastText||''); }
  }
};
/* 在线朗读兜底：<audio> 播放后端 edge-tts 合成的 mp3 */
function onlineAudio(text){
  if(window._audioDead===true){ webSpeak(text); return; }
  try{
    if(sp._au){ try{ sp._au.pause(); }catch(e){} sp._au=null; }
    const a=new Audio('/api/tts/audio?text='+encodeURIComponent(text)+'&rate='+ttsRate());
    sp._au=a; sp.cur=a; sp._native=false;
    a.onended=()=>{ if(sp.on && sp.cur===a) window._ttsNext(); };          // 读完 → 下一条
    a.onerror=()=>{ if(sp.on && sp.cur===a){ window._audioDead=true; webSpeak(text); } };
    const p=a.play();
    if(p && p.catch) p.catch(()=>{ if(sp.on && sp.cur===a){ window._audioDead=true; webSpeak(text); } });
  }catch(e){ window._audioDead=true; webSpeak(text); }
}
function btSpeak(text){
  clearTimeout(sp._poll);
  fetch('/api/tts/speak',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text,rate:ttsRate()})}).then(r=>r.json()).then(j=>{
    if(!j||!j.ok){ window._btts=false; onlineAudio(text); return; }
    const poll=()=>{ sp._poll=setTimeout(()=>{
      fetch('/api/tts/status').then(r=>r.json()).then(s=>{
        if(!sp.on) return;                      // 用户已停止
        if(s.err){ window._btts=false; toast('语音引擎异常：'+s.err+'，已切换备用朗读'); onlineAudio(text); return; }
        if(!s.speaking){ window._ttsNext(); }   // 本条读完 → 下一条
        else poll();
      }).catch(()=>{ if(sp.on) window._ttsNext(); });
    },260); };
    poll();
  }).catch(()=>{ window._btts=false; onlineAudio(text); });
}
function webSpeak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance();
  u.rate=ttsRate();
  u.lang='zh-CN';
  sp.cur=u;  // 标记当前语音，忽略被 cancel 的旧回调
  u.onend=()=>{ if(!sp.on||sp.cur!==u) return; window._ttsNext(); };
  u.onerror=(e)=>{ if(!sp.on||sp.cur!==u) return; if(e&&(e.error==='interrupted'||e.error==='canceled')) return; window._ttsNext(); };
  u.text=text;
  speechSynthesis.speak(u);
}
/* 组朗读队列：看板模式按面板顺序逐源朗读（每源前 10 条，读完一源再读下一源）；其余视图读当前列表 */
function buildSpeakList(){
  const isBoard = state.layout==='board' && state.view==='all' && state.cat!=='__top' && state.cat!=='__region';
  if(!isBoard) return currentList().filter(match);
  const out=[];
  enabledInCat().forEach(s=>{
    const d=state.data[s.id]||{};
    const fm=(d.items||[]).filter(match).slice(0,10);
    fm.forEach((it,i)=>out.push(Object.assign({},it,{srcName:s.name,srcId:s.id,
      _board:true,_lead:i===0,_no:i+1,_cnt:fm.length,_i:out.length})));
  });
  return out;
}
function speakCurrent(cont){
  if(!('speechSynthesis' in window)&&!hasNativeTts()){ toast('当前环境不支持朗读'); return; }
  if(!cont){  // 全新开始：重建队列
    const list=buildSpeakList();
    if(!list.length){ toast('本页没有可朗读的标题'); return; }
    sp.list=list; sp.i=0; sp.on=true; sp.paused=false;
    $('#player').classList.add('on');
  }
  if(!sp.on) return;
  if(sp.i>=sp.list.length){ stopSpeak(); toast('已读完本页看板'); return; }
  const it=sp.list[sp.i];
  updateSpeakUI();
  const num=it._board ? it._no : (sp.i+1);
  speakText((it._board&&it._lead ? it.srcName+'。' : '')+num+'，'+it.title);
}
/* 原生 TTS 每读完全部内容回调一次，推进到下一条 */
window._ttsNext=()=>{
  if(!sp.on) return;
  sp.i++;
  if(sp.i>=sp.list.length){ stopSpeak(); toast('本页已读完'); return; }
  setTimeout(()=>{ if(sp.on) speakCurrent(true); },150);
};
function stopSpeak(){
  sp.on=false; sp.paused=false; sp.cur=null;
  clearTimeout(sp._poll);
  if(sp._au){ try{ sp._au.pause(); }catch(e){} sp._au=null; }
  fetch('/api/tts/stop',{method:'POST'}).catch(()=>{});
  try{ speechSynthesis.cancel(); }catch(e){}
  if(hasNativeTts()){ try{ window.RebangNative.stopSpeak(); }catch(e){} }
  $('#player').classList.remove('on');
  document.querySelectorAll('.speaking').forEach(n=>n.classList.remove('speaking'));
}
$('#btnTts').onclick=()=>{
  if(sp.on && !sp.paused){
    if(hasNativeTts()){ try{ window.RebangNative.pauseSpeak(); }catch(e){} }
    else if(window._btts!==false){ clearTimeout(sp._poll); fetch('/api/tts/stop',{method:'POST'}).catch(()=>{}); }
    else speechSynthesis.pause();
    sp.paused=true;
    $('#ppBtn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'; return; }
  if(sp.on && sp.paused){
    sp.paused=false;
    if(hasNativeTts()){ speakCurrent(true); }  // 原生不支持暂停，从当前条重读
    else if(window._btts!==false){ speakCurrent(true); }  // 后端语音同理，从当前条重读
    else { speechSynthesis.resume();
      $('#ppBtn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>'; }
    return; }
  speakCurrent();
};
$('#ppBtn').onclick=()=>$('#btnTts').click();
$('#pStop').onclick=stopSpeak;
$('#pRate').oninput=e=>{
  const v=parseFloat(e.target.value);

/* 绑定推广位设置块里的交互（只在作者登录、块存在时调用） */
function bindAdBlock(B,S){
  const box=B.querySelector('#adSetBox');
  if(!box) return;
  // 展示形式（大卡片 / 横幅 / 列表行）
  box.querySelectorAll('[data-k="adStyle"]').forEach(btn=>btn.onclick=()=>{
    S.adStyle=btn.dataset.v; saveCfg();
    box.querySelectorAll('[data-k="adStyle"]').forEach(x=>x.classList.toggle('on',x.dataset.v===S.adStyle));
    if(state.cat==='推广') render();
  });
  const adSave=box.querySelector('#adSave');
  if(!adSave) return;
  adSave.onclick=async()=>{
    const g=id=>{ const n=B.querySelector(id); return n?n.value.trim():''; };
    const msg=B.querySelector('#adMsg');
    S.adWarm=g('#adWarm')||'你的支持，是我一直更新下去的最大动力 ❤';
    S.adWarmSub=S.adWarmSub||'';
    S.adTitle=g('#adTitle')||'作者其他软件 · 美拍姿势库（安卓 APK）';
    S.adDesc=g('#adDesc')||'1700+ 宫格图片，拒绝拍照尴尬，记录每一份美好。';
    S.adUrl=g('#adUrl')||'https://pan.baidu.com/s/5gZ0hq4QQPHVSmFj_XYwnnA';
    S.adContact=g('#adContact')||'Q&V：460275097';
    const ad={}; AD_KEYS.forEach(k=>{ ad[k]=S[k]||''; });
    saveCfg();
    adSave.disabled=true; if(msg) msg.textContent='正在发布…';
    try{
      const r=await api(adBase()+'/api/ad',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ad})});
      if(r&&r.ok){
        try{ localStorage.setItem('hb_ad_v1',JSON.stringify(ad)); }catch(e){}
        toast('已发布到全网，其他人下次打开自动更新');
        if(msg) msg.textContent='已发布 ✓';
      }else{
        const er=(r&&r.error)||'发布失败';
        toast(er); if(msg) msg.textContent=er;
      }
    }catch(e){ toast('发布失败：'+(e.message||'网络问题')); if(msg) msg.textContent='发布失败'; }
    adSave.disabled=false;
    if(state.cat==='推广') render();
  };
}

(function(){

  if(!box) return;
  const fix=()=>{
    box.querySelectorAll('.field .hint').forEach(h=>{
      const t=(h.textContent||'').trim();
      if(t && h.getAttribute('data-tip')!==t){ h.setAttribute('data-tip',t); h.title=t; }
    });
  };
  fix();
  if(window.MutationObserver) new MutationObserver(fix).observe(box,{childList:true,subtree:true});

    const h=ev.target.closest && ev.target.closest('.hint');

/* ============ V8.1：新闻源校准向导 ============
   用户添加的源提取到导航/目录时，在这里自助选择「哪个目录下的题目」：
   程序枚举页面上最像新闻列表的候选（每候选 5 条样例 + 10 条预览），
   用户点选后锁定 sel 选择器保存，之后抓取直取锁定选择器（零额外开销）。 */
function openCalib(src, onDone){
  document.querySelectorAll('.calibov').forEach(n=>n.remove());
  let chosen=null;
  const ov=document.createElement('div'); ov.className='calibov';
  ov.innerHTML=`<div class="calibpn">
    <div class="cHead"><b>校准新闻列表</b><span style="font-size:11.5px;color:var(--sub)">选出标题正确的列表</span><button class="mini cClose">✕</button></div>
    <div class="cUrlRow"><input class="cUrl" value="${esc(src.url||'')}" spellcheck="false" placeholder="榜单地址 https://…"><button class="mini primary cGo">分析页面</button></div>
    <div class="cTip">点候选卡选「哪个目录下的题目」；提取出的是分类名/导航就换一个候选，或改成官网子页面地址再分析。要校准「源内检索」，就填含 <b>{q}</b> 的搜索地址（如 https://站点/search?q={q}）再分析。</div>
    <div class="cList"><div class="cLoading" style="color:var(--sub);font-size:12.5px;padding:10px 2px">正在分析页面…</div></div>
    <div class="cFoot"><button class="mini primary cSave" disabled>保存校准</button><span class="cMsg">${src.sel&&src.sel.link||src.sel&&src.sel.block?'已校准过，可重新选择':'未校准，使用自动识别'}</span></div>
  </div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  ov.querySelector('.cClose').onclick=close;
  const list=ov.querySelector('.cList'), msg=ov.querySelector('.cMsg'), saveB=ov.querySelector('.cSave');
  const render=(cands)=>{
    list.innerHTML='';
    if(!cands.length){ list.innerHTML='<div class="cand"><div class="cErr">这个页面没有识别出候选列表。试试：①改成官网子页面/栏目页地址 ②该站可能是 JS 渲染，需专用解析器</div></div>'; return; }
    cands.forEach((c,i)=>{
      const d=document.createElement('div'); d.className='cand'; d.dataset.i=i;
      const badge=c.menu?'<span class="bdg warn">⚠️ 疑似导航/栏目</span>':'<span class="bdg ok">✓ 新闻列表</span>';
      d.innerHTML=`<div class="cT">${badge}<span>约 ${c.count} 条</span><span>${c.kind==='cls'?'同标记列表':'同容器列表'}</span><span>推荐度 ${c.score}</span></div>
        <div class="cS">${(c.sample||[]).map(t=>`<div title="${esc(t)}">${esc(t)}</div>`).join('')}</div>
        <div class="cPrev" style="display:none"></div>`;
      d.onclick=()=>{
        list.querySelectorAll('.cand').forEach(x=>x.classList.remove('on'));
        d.classList.add('on'); chosen=c; saveB.disabled=false;
        msg.textContent='已选择：约 '+c.count+' 条，保存后立即生效';
      };
      d.ondblclick=()=>{ d.onclick&&d.onclick(); saveB.click(); };
      list.appendChild(d);
    });
  };
  const load=(u)=>{
    if(!/^https?:\/\//i.test(u||'')){ msg.textContent='请填写有效地址'; return; }
    chosen=null; saveB.disabled=true;
    list.innerHTML='<div style="color:var(--sub);font-size:12.5px;padding:10px 2px">正在分析页面…</div>';
    api('/api/candidates?url='+encodeURIComponent(u)).then(r=>{
      if(!r.ok){ list.innerHTML='<div class="cand"><div class="cErr">分析失败：'+esc(r.error||'未知错误')+'。可尝试改用子页面地址或 RSS 地址。</div></div>'; return; }
      render(r.candidates||[]);
    }).catch(err=>{ list.innerHTML='<div class="cand"><div class="cErr">网络错误：'+esc((err&&err.message)||'页面抓取失败，检查地址或网络后重试')+'</div></div>'; });
  };
  ov.querySelector('.cGo').onclick=()=>load(ov.querySelector('.cUrl').value.trim());
  ov.querySelector('.cUrl').addEventListener('keydown',e=>{ if(e.key==='Enter') load(e.target.value.trim()); });
  saveB.onclick=()=>{
    if(!chosen){ toast('先点选一个候选列表'); return; }
    const curUrl=ov.querySelector('.cUrl').value.trim();
    if(curUrl.indexOf('{q}')>=0){
      /* 检索地址校准：保存到 search + search_sel，不动主地址 */
      src.search=curUrl; src.search_sel=chosen.sel;
      saveCfg(); close();
      if(typeof onDone==='function') onDone(src);
      toast('已校准「检索结果页」：之后在源内搜索直接显示结果');
      return;
    }
    src.sel=chosen.sel;
    src.url=curUrl;                 /* V8.0.4：向导里改过地址就以新地址为准（换子页面的核心用法） */
    src.calib={url:curUrl, at:Date.now(),
               sample:(chosen.preview||[]).slice(0,3).map(x=>x.title)};
    if(!src.parser||src.parser==='auto') src.parser='html';
    saveCfg();
    close();
    if(typeof onDone==='function') onDone(src);
    else { try{ loadSources([src],true); }catch(_e){} toast('已校准「'+(src.name||'源')+'」：之后按锁定的列表抓取'); }
  };
  load(src.url||'');
}

function openCatPick(anchor, s){

  pop.style.left=Math.max(8, Math.min(r.left, window.innerWidth-pw-8))+'px';
  pop.style.top=Math.max(8, Math.min(r.bottom+6, window.innerHeight-ph-8))+'px';

    anchor.textContent=catLabel(s)+(srcCats(s).length>1?` +${srcCats(s).length-1}`:'')+' ▾';
  };
  pop.querySelectorAll('input').forEach(i=>i.onchange=()=>{
    const sel=[...pop.querySelectorAll('input:checked')].map(x=>x.value);
    if(!sel.length){ i.checked=true; toast('至少要保留一个分类'); return; }
    if(sel.length>4){ i.checked=false; toast('一个源最多 4 个分类'); return; }
    setSrcCats(s, sel); saveCfg(); renderCats(); renderSidebar(); render(); paint();
  });
  pop.querySelector('[data-cancel]').onclick=()=>pop.remove();
  const close=ev=>{ if(!pop.contains(ev.target) && ev.target!==anchor){
      pop.remove(); document.removeEventListener('mousedown',close,true); } };
  setTimeout(()=>document.addEventListener('mousedown',close,true),0);
}

    /* V7.9：离线翻译模型面板（下载 / 进度 / 删除 / 试翻） */
    const offBox=B.querySelector('#offBox');

      let pv=null;
      const stopPoll=()=>{ if(pv){ clearInterval(pv); pv=null; } };
      const paint=(st)=>{
        st=st||{};

        if(busy){
          h=`<div style="display:flex;align-items:center;gap:10px">

            <div style="font-size:11.5px;color:var(--sub);margin-top:5px">${esc(st.msg||'正在下载')}，可以关掉设置继续用，下完自动生效</div>`;
        }else if(st.installed){
          h=`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap">

              <button class="pill primary" id="offDl" ${st.runtime?'':'disabled title="当前程序缺少离线运行库"'}>下载离线模型（约 68MB）</button>

    /* V7.8.1 证书修复面板；V7.9.4：默认折叠（平时只显示一行摘要）+ 一键全部检测安装 */
    const certBox=B.querySelector('#certBox');
    if(certBox){

      const isOpen=()=>{ try{ const v=localStorage.getItem('hb_cert_open2'); return v===null?false:v==='1'; }catch(e){ return false; } };
      const setOpen=v=>{ try{ localStorage.setItem('hb_cert_open2',v?'1':'0'); }catch(e){} };

      const itemHtml=(it)=>{
        const ch=it.chain||[];
        const rows=ch.map((c,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 0">

        const need=ch.filter(c=>!c.selfSigned&&!c.installed).length;

      const paint=()=>{

        if(!hosts.length) return;
        setOpen(true);
        btn.disabled=true; btn.textContent='批量处理中…';

          certProg=`正在处理 ${i}/${hosts.length}：${h}`; paint();
          const b2=certBox.querySelector('#certAll');
          if(b2){ b2.disabled=true; b2.textContent='批量处理中 '+(i-1)+'/'+hosts.length; }
          try{
            let r=await api('/api/cert/chain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:h})});

            const it=certItems.find(x=>x.host===h)||{};

        paint();

      可<b>导出</b>全部源为文件、用文件<b>批量导入</b>。改完地址点“测”可以马上验证能不能解析。`));
    /* ---- 分类管理（V6.2：分类由用户自己增删改） ---- */
    const cm=el('div'); cm.style.cssText='display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:8px 10px;background:var(--panel);border-radius:10px';

                <button class="mini danger" data-hdel="${esc(c)}" title="删除该分类及里面的 ${n} 个源（不再抓取）"

/* ---------------- V8.0.8：搜索联想（新闻源在前，标题在后，输入即出） ---------------- */
let _qsTimer=null,_qsIdx=-1,_qsItems=[];
function qsHide(){ const b=$('#qSug'); if(b){ b.classList.remove('on'); b.innerHTML=''; } _qsIdx=-1; _qsItems=[]; }
function qsOpen(){ const b=$('#qSug'); if(b) b.classList.add('on'); }
function qsBuild(kw){
  const box=$('#qSug'); if(!box) return;
  const k=kw.toLowerCase();
  if(!k){ qsHide(); return; }
  const srcs=(state.cfg.sources||[]).filter(s=>s.enabled!==false).filter(s=>
    (s.name||'').toLowerCase().includes(k) || (s.id||'').toLowerCase().includes(k)
    || String(s.cat||'').toLowerCase().includes(k)).slice(0,6);
  const hits=[]; const seen={};
  const srcOf={}; (state.cfg.sources||[]).forEach(s=>{ srcOf[s.id]=s.name||''; });
  for(const sid in state.data){
    const d=state.data[sid]; if(!d||!d.items) continue;
    for(const it of d.items){
      if(!it||!it.title) continue;
      if(it.title.toLowerCase().indexOf(k)<0) continue;
      const key=it.title.replace(/[\s\W]+/g,'').slice(0,24);
      if(seen[key]) continue; seen[key]=1;
      hits.push({t:it.title,u:it.url,s:srcOf[sid]||''});
      if(hits.length>=14) break;
    }
    if(hits.length>=14) break;
  }
  let h='';
  if(srcs.length){
    h+='<div class="qs-h">新闻源</div>';
    h+=srcs.map(s=>`<div class="qs-i" data-qs-src="${esc(s.id)}"><span class="qs-d"></span>
      <span class="qs-n">${esc(s.name)}</span><span class="qs-c">${esc(catLabel(s))}</span>
      <span class="qs-s">${dcount(s.id)} 条</span></div>`).join('');
  }
  if(hits.length){
    h+='<div class="qs-h">新闻标题</div>';
    h+=hits.map(x=>`<div class="qs-i" data-qs-url="${esc(x.u||'')}" title="${esc(x.t)}">
      <span class="qs-t">${esc(x.t)}</span><span class="qs-s">${esc(x.s)}</span></div>`).join('');
  }
  if(!h) h='<div class="qs-e">没找到「'+esc(kw)+'」相关的源或标题</div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-qs-src]').forEach(n=>{
    n.onmousedown=ev=>{ ev.preventDefault(); ev.stopPropagation(); };
    n.onclick=ev=>{ ev.stopPropagation();
      state.view=n.dataset.qsSrc; $('#q').value=''; state.filter=''; qsHide();
      renderSidebar(); render(); };
  });
  box.querySelectorAll('[data-qs-url]').forEach(n=>{
    n.onmousedown=ev=>{ ev.preventDefault(); ev.stopPropagation(); };
    n.onclick=ev=>{ ev.stopPropagation(); const u=n.dataset.qsUrl;
      if(u){ try{ window.open(u,'_blank'); }catch(e){} }
      qsHide(); };
  });
  _qsItems=[...box.querySelectorAll('.qs-i')]; _qsIdx=-1;
  qsOpen();
}
function dcount(sid){ const d=state.data[sid]; return (d&&d.items)?d.items.length:'·'; }
$('#q').oninput=e=>{
  const v=e.target.value;
  state.filter=v.trim(); render();            /* 内容区同时实时筛选 */
  clearTimeout(_qsTimer);
  _qsTimer=setTimeout(()=>qsBuild(v.trim()), 60);   /* 60ms 防抖，打字即出 */
};
$('#q').onfocus=e=>{ if(e.target.value.trim()) qsBuild(e.target.value.trim()); };
$('#q').onblur=()=>{ setTimeout(qsHide, 120); };
$('#q').onkeydown=e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!_qsItems.length) return;
    e.preventDefault();
    _qsIdx=(_qsIdx+(e.key==='ArrowDown'?1:-1)+_qsItems.length)%_qsItems.length;
    _qsItems.forEach((n,i)=>n.classList.toggle('cur',i===_qsIdx));
    const cur=_qsItems[_qsIdx]; if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Enter'){
    const kw=e.target.value.trim();
    if(_qsIdx>=0 && _qsItems[_qsIdx]){ _qsItems[_qsIdx].click(); return; }
    const s = state.view==='all'? enabled()[0] : state.cfg.sources.find(x=>x.id===state.view);
    if(s&&s.search&&kw){
      /* V8.1：已校准检索结果页 → 软件内显示结果；否则维持跳浏览器 */
      if(s.search_sel&&(s.search_sel.link||s.search_sel.block)){ openSrcSearch(s,kw); return; }
      window.open(s.search.replace('{q}',encodeURIComponent(kw)),'_blank');
      return;
    }
    if(_qsItems.length) _qsItems[0].click();
  }
  if(e.key==='Escape'){ e.target.value=''; state.filter=''; render(); qsHide(); }
};
document.addEventListener('click',e=>{ if(e.target.closest&&!e.target.closest('#searchWrap')) qsHide(); });

  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  ov.querySelector('.cClose').onclick=()=>ov.remove();
  api('/api/searchsrc?id='+encodeURIComponent(s.id)+'&q='+encodeURIComponent(kw)).then(r=>{
    const L=ov.querySelector('#srList');
    if(!r.ok){ L.innerHTML='<div class="cand"><div class="cErr">检索失败：'+esc(r.error||'')+'</div></div>'; return; }

    if(!its.length){ L.innerHTML='<div class="cand"><div style="color:var(--sub);padding:6px 2px">没有检索到内容。可在设置里点「校」，用含 {q} 的搜索地址重新校准。</div></div>'; return; }
    L.innerHTML=its.map(i=>`<div class="cand" data-u="${esc(i.url||'')}">
      <div class="cS"><div style="white-space:normal">${esc(i.title||'')}</div></div></div>`).join('');
    L.querySelectorAll('.cand').forEach(d=>d.onclick=()=>{ if(d.dataset.u) openExt(d.dataset.u); });
  }).catch(()=>{ ov.querySelector('#srList').innerHTML='<div class="cand"><div class="cErr">网络错误</div></div>'; });
}

let autoTimer=null;
function setupAuto(){

/* 启动检测：强制刷新，失败源自动隐藏，可一键恢复 */
/* 启动检测：先缓存秒开 → 后台强制刷新 → 失败源自动隐藏，可一键恢复 */
function startupDetect(){
  const list=fetchable();
  if(!list.length) return;
  const check=()=>{
    if(state.cfg.settings.startupCheck===false) return;
    const bad=list.filter(s=>(state.data[s.id]||{}).error);
    if(bad.length && state.cfg.settings.srcLocked){
      state.autoHidden=[];   // 锁定模式下不自动隐藏，只提示
      toast(bad.length+' 个源启动检测失败（已锁定，未自动隐藏）');
    }else if(bad.length){
      state.autoHidden=bad.map(s=>({id:s.id,name:s.name}));
      state.autoHiddenAt=Date.now();   // V7.9.3：不重置「已关闭」标记，用户关掉后本次运行不再弹
      bad.forEach(s=>s.enabled=false);
      saveCfg(); renderSidebar(); render();
      toast(bad.length+' 个源启动检测失败，已自动隐藏');
    }else{
      state.autoHidden=[];
    }
  };
  /* V7.9.3：第一轮「不强制」——有缓存就毫秒级返回并立刻上屏；
     随后再补一轮强制抓取（后台跑，不挡界面），抓完再做失败源检测。 */
  loadSources(list,false).finally(()=>{
    setTimeout(()=>{ loadSources(list,true).then(check).catch(()=>{}); }, 400);
  });
}
function restoreHidden(){
  const list=state.autoHidden||[];
  const back=list.map(h=>state.cfg.sources.find(s=>s.id===h.id)).filter(Boolean);
  state.autoHidden=[];
  back.forEach(s=>s.enabled=true);
  saveCfg(); renderSidebar(); render();
  if(back.length) loadSources(back,true);
  toast('已恢复 '+back.length+' 个源');
}

/* ============ M8.2：手机 UA（Android / iPhone）自动套用 APK 版排版 ============ */
const MI={
  board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6.5h16"/><path d="M4 12h16"/><path d="M4 17.5h16"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>'
};
function isMobileUA(){
  const ua=navigator.userAgent||'';
  return /Android|iPhone|iPod|iPad|Mobile|HarmonyOS|OpenHarmony/i.test(ua);
}
function openSideM(){ const sb=$('#sidebar'); if(sb) sb.classList.add('open'); document.body.classList.add('rbSide'); }
function closeSideM(){ const sb=$('#sidebar'); if(sb) sb.classList.remove('open'); document.body.classList.remove('rbSide'); }
function toggleSideM(){ document.body.classList.contains('rbSide')?closeSideM():openSideM(); }
function buildRailM(){
  let rail=$('#rbRail');
  if(!rail){ rail=document.createElement('div'); rail.id='rbRail'; document.body.appendChild(rail); }
  ['btnTts','btnRefresh','btnTr','btnSet2'].forEach(id=>{
    const b=$('#'+id); if(!b||b.parentNode===rail) return;
    b.classList.remove('ib'); b.classList.add('ri'); rail.appendChild(b);
  });
}
function isApkShell(){
  /* Android WebView（APK 壳）的 UA 带 wv 标记；这种由 shell.js 排版，本函数不介入 */
  const ua=navigator.userAgent||'';
  return /\bwv\b/i.test(ua) || /RebangApp/i.test(ua);
}
function initMobileView(){
  /* APK 端排版已经由壳层（shell.js/css）负责且用户确认没问题，这里完全不动；
     只有「手机浏览器打开网页版」才套用 APK 版排版 */
  if(isApkShell()) return;
  if(!isMobileUA()) return;
  document.body.classList.add('rb-m');
  const tb=document.querySelector('.topbar'); if(!tb) return;
  /* 1) 视图切换只留图标 */
  const seg=$('#segLayout');
  if(seg&&!seg.dataset.mIco){
    seg.dataset.mIco='1';
    const b1=seg.querySelector('[data-v="board"]'), b2=seg.querySelector('[data-v="list"]');
    if(b1){ b1.innerHTML=MI.board; b1.title='总览'; b1.setAttribute('aria-label','总览'); }
    if(b2){ b2.innerHTML=MI.list; b2.title='列表'; b2.setAttribute('aria-label','列表'); }
  }
  /* 2) 搜索框缩成一个图标，点开才展开 */
  const box=document.querySelector('.search');
  if(box&&!box.dataset.mMini){
    box.dataset.mMini='1';
    box.addEventListener('click',e=>{
      if(box.classList.contains('rbOpen')) return;
      e.preventDefault(); box.classList.add('rbOpen');
      const inp=$('#q'); if(inp) setTimeout(()=>{ try{ inp.focus(); }catch(_e){} },60);
    },true);
    const inp=$('#q');
    if(inp){
      inp.addEventListener('blur',()=>setTimeout(()=>{ if(!inp.value) box.classList.remove('rbOpen'); },120));
      inp.addEventListener('keydown',e=>{ if(e.key==='Escape'){ box.classList.remove('rbOpen'); inp.blur(); } });
    }
  }
  /* 3) 侧边栏按钮固定在左上角 */
  if(!$('#rbMenu')){
    const m=document.createElement('button');
    m.id='rbMenu'; m.className='ib'; m.title='菜单'; m.setAttribute('aria-label','侧边栏');
    m.innerHTML=MI.more;
    m.onclick=e=>{ e.stopPropagation(); toggleSideM(); };
    tb.insertBefore(m,tb.firstChild);
  }
  if(!$('#rbSideMask')){
    const mk=document.createElement('div'); mk.id='rbSideMask';
    mk.onclick=closeSideM; document.body.appendChild(mk);
  }
  ['#navAll','#navFav','#navHist','#catRow','#srcList','#btnAdd','#btnSet'].forEach(sel=>{
    const n=$(sel); if(n) n.addEventListener('click',()=>setTimeout(closeSideM,140));
  });
  /* 触摸菜单栏（侧栏）以外的地方自动收起 */
  document.addEventListener('click',e=>{
    if(!document.body.classList.contains('rbSide')) return;
    const sb=$('#sidebar');
    if(sb&&sb.contains(e.target)) return;
    if(e.target.closest&&e.target.closest('#rbMenu')) return;
    closeSideM();
  },true);
  /* 4) 朗读 / 刷新 / 翻译 / 设置 收进右下悬浮竖排 */
  buildRailM();
}
initMobileView();

api('/api/config').then(cfg=>{
  /* M9.2：页面被缓存（APK 的 WebView / 浏览器旧标签）时，服务端版本更高就强制刷新一次。
     之前用户遇到的「侧边栏没隐藏分类、设置里只有 13 个分类、综合源数暴涨」都是旧页面造成的。 */
  try{
    const _sv=String((cfg&&cfg.app)||'').replace(/^V/i,'');
    const _lv=String(APP_VER||'').replace(/^V/i,'');
    if(_sv && _lv && _sv!==_lv && !sessionStorage.getItem('hb_reload_'+_sv)){
      sessionStorage.setItem('hb_reload_'+_sv,'1');
      const _u=location.pathname+'?v='+encodeURIComponent(_sv)+location.hash;
      location.replace(_u); return;
    }
  }catch(e){}
  state.cfg=cfg; state.favs=cfg.favorites||[]; state.hist=cfg.history||[];
  /* V7.9.3：本机设置习惯优先（网页版/云端实例重启后服务端配置可能回默认，本地这份兜住）
     V8.0.1 修正：本机那份是旧版留下的（比如 hideCats 还是空的/旧的 15 个）时，会把服务端
     迁移好的「默认隐藏 17 分类」覆盖掉 —— 表现就是侧边栏又冒出那 17 个分类。
     所以「隐藏清单」改成 服务端 ∪ 本机 −（用户明确恢复过的），绝不让旧副本把隐藏项顶回去。 */
  try{
    const ls=JSON.parse(localStorage.getItem('hb_cfg_local')||'null');
    if(ls&&typeof ls==='object'){
      AD_KEYS.forEach(k=>{ delete ls[k]; });
      const sv=state.cfg.settings||{};
      const svHide=Array.isArray(sv.hideCats)?sv.hideCats:[];
      const lcHide=Array.isArray(ls.hideCats)?ls.hideCats:[];
      const unh=[].concat(Array.isArray(sv.unhideCats)?sv.unhideCats:[],
                          Array.isArray(ls.unhideCats)?ls.unhideCats:[])
                    .filter(x=>typeof x==='string');
      state.cfg.settings=Object.assign({},sv,ls);
      const hid=[];
      svHide.concat(lcHide).forEach(c=>{
        if(typeof c==='string' && hid.indexOf(c)<0 && unh.indexOf(c)<0) hid.push(c);
      });
      state.cfg.settings.hideCats=hid;
      state.cfg.settings.unhideCats=unh.filter((c,i)=>unh.indexOf(c)===i);
      state._hideFix=true;
    }
  }catch(e){}
  /* V8.0.0：exe / 网页版「初次打开」默认值（APK 壳不套用这批默认，保持原样）
     判据：本机没保存过设置（hb_cfg_local 不存在）+ 不在 APK 里（RebangNative 是 APK 注入的接口） */
  try{
    const _isApk=(typeof window.RebangNative!=='undefined');
    if(!_isApk && !localStorage.getItem('hb_cfg_local')){
      Object.assign(state.cfg.settings,{
        boardCols:4, boardRows:2,   // 看板 4 列 2 行
        translate:'off', titleTrans:false,            // 翻译默认关闭
        perSource:20, boardCount:15,                 // 每源 20 / 看板每源 15
        notifySec:0,                                 // 抓取失败提示条默认关闭
        showOnlyOk:false, startupCheck:true,         // V8.0.8：只显示可用源默认关闭（否则隐藏了就在侧栏找不到源）/ 启动自动检测默认开启
        accent:''                                    // 主题配色：经典红
      });
    }
  }catch(e){}
  refreshCats();   // V6.2 分类以用户配置为准
  if(state._hideFix){ state._hideFix=false; try{ saveCfg(); }catch(e){} }   // V8.0.1：把合并后的隐藏清单写回
  /* V8.0.8：在线翻译引擎（谷歌/百度/有道）已移除，只保留本机离线模型；不再回填在线密钥 */
  /* M8.1：默认值改为 每源 20 / 看板 15 / 看板 4 列 2 行（旧的 10/15 迁移逻辑已停用，
     避免把新默认值又改回 10） */
  if(!localStorage.getItem('hb_vc5')) localStorage.setItem('hb_vc5','1');
  if(!localStorage.getItem('hb_vc51')){   // V6.0：默认读速 1 → 1.25 倍（老用户一次性迁移）
    const S=state.cfg.settings;
    if(+S.ttsRate===1) S.ttsRate=1.25;
    localStorage.setItem('hb_vc51','1'); saveCfg();
  }
  const h=decodeURIComponent(location.hash||'');
  if(h.includes('text')) cfg.settings.view='text';
  if(h.includes('dark')) cfg.settings.theme='dark';
  if(h.startsWith('#src:')) state.view=h.slice(5);
  if(h.includes('fav')) state.view='fav';
  if(h.includes('hist')) state.view='hist';
  if(h.includes('listview')) state.layout='list';
  // 每次打开默认：聚合 · 全部分类 · 总览
  state.view='all'; state.cat='全部'; state.layout='board';
  applyLook(); applyFontFallback();
  $('#pRate').value=cfg.settings.ttsRate||1.25;
  $('#pRateV').textContent=((v)=>v===1.25?'1.25':v.toFixed(1))(cfg.settings.ttsRate||1.25)+'x';
  /* V7.9.3：先把上次抓到的内容铺出来（0 请求、0 等待），再让接口补新数据 */
  const snap=loadSnap();
  if(snap&&snap.d){
    Object.keys(snap.d).forEach(k=>{
      const cur=state.data[k]||{};
      if(!(cur.items||[]).length && snap.d[k]&&(snap.d[k].items||[]).length) state.data[k]=snap.d[k];
    });
  }
  renderCats(); renderSidebar(); render(); setupAuto();
  if(snap&&snap.d) document.documentElement.setAttribute('data-snap','1');
  startupDetect();   // 先读缓存秒开，再后台刷新 + 检测失败源
  /* 首次使用：提示去哪里看使用指导（含翻译/排序/设置的图解说明） */
  try{
    if(!localStorage.getItem('hb_guide_tip')){
      localStorage.setItem('hb_guide_tip','1');
      setTimeout(()=>toast('第一次用？右上角 ⚙ 设置 → 使用指导 有完整说明'),1400);
    }
  }catch(e){}
  /* M8.0：启动时恢复登录状态（refresh_token 自动续期）；已登录且云端有配置 → 询问是否覆盖本地 */
  acctRefresh().then(()=>acctAskCloudCover());
  /* V7.9.4：推广位内容以作者发布为准（桌面版也走中心服务器，作者改一次全员更新） */
  syncAd().then(()=>{ if(state.cat==='推广') render(); });
  if(h.startsWith('#set')) openModal(h.includes('sources')?'sources':(h.includes('about')?'about':(h.includes('look')?'look':'general')));
}).catch(e=>{
  $('#content').innerHTML=`<div class="empty"><div class="big">🔌</div>本地服务未响应<br>${esc(e.message)}</div>`;
});
