<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>热榜助手</title>
<style>
:root{
  --bg:#f2f3f5; --panel:#ffffff; --panel2:#fafbfc; --text:#14171c; --sub:#6d7683;
  --line:#e5e8ec; --line2:#eff1f4; --accent:#e8402f; --accent2:#ff7a45;
  --blue:#3b6ef6; --blue2:#5b8cff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.12);
  --shadow-h:0 2px 6px rgba(16,24,40,.08),0 18px 40px -18px rgba(16,24,40,.24);
  --radius:14px; --fs:15px; --font:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a21; --panel2:#1b2029; --text:#e9ecf1; --sub:#96a0af;
  --line:#262d38; --line2:#1f252e; --accent:#ff5a4d; --accent2:#ff8a5c;
  --blue:#5b8cff; --blue2:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-h:0 2px 8px rgba(0,0,0,.4),0 20px 44px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-size:var(--fs);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--bgimg,none);background-size:cover;background-position:center;
  opacity:var(--bgop,.14);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(130,140,155,.35);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(130,140,155,.6);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}

.app{display:grid;grid-template-columns:244px 1fr;height:100vh}

/* ---------- 侧栏 ---------- */
.sidebar{background:color-mix(in srgb,var(--panel) 92%,transparent);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 15px 10px}
.mark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#2f6bf0,#67a2ff 55%,#8fd0ff);
  box-shadow:0 7px 16px -7px rgba(59,110,246,.85)}
.mark svg{width:21px;height:21px;color:#fff}
.brand h1{font-size:16px;margin:0;font-weight:700;line-height:1.2;letter-spacing:.2px}
.brand .ver{font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b6ef6,#69a6ff);
  padding:2px 5px;border-radius:5px;margin-left:5px;vertical-align:2px}
.brand .by{font-size:11px;color:var(--sub);margin-top:3px}
.nav{display:flex;gap:5px;padding:12px 12px 4px}
.nav button{flex:1;padding:7px 4px;border-radius:8px;font-size:12.5px;color:var(--sub);
  display:flex;align-items:center;justify-content:center;gap:4px;transition:.15s}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);font-weight:600}
.nav button svg{width:14px;height:14px}
.side-label{font-size:11px;color:var(--sub);letter-spacing:.06em;padding:10px 16px 6px;display:flex;
  justify-content:space-between;align-items:center}
.side-label span:last-child{font-size:10.5px;opacity:.75}
.src-list{flex:1;overflow-y:auto;padding:0 9px 8px;min-height:0}
.src-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;cursor:pointer;
  transition:background .15s;position:relative;user-select:none}
.src-item:hover{background:var(--panel2)}
.src-item.active{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.src-item.active .nm{color:var(--blue);font-weight:600}
.src-item.drag{opacity:.4}
.src-item.over{box-shadow:inset 0 2px 0 var(--blue)}
/* V7.1/M5.4：拖动源时列表下方的「隐藏/删除」投放区 */
.src-dropzone{display:none;gap:6px;margin-top:8px;justify-content:space-between}
.src-dropzone .dz-btn{flex:0 0 46%;text-align:center;font-size:11.5px;font-weight:600;border-radius:8px;
  padding:8px 4px;border:1.5px dashed;user-select:none;background:var(--panel2)}
.src-dropzone .dz-hide{color:#d97706;border-color:#d97706}
.src-dropzone .dz-del{color:#dc2626;border-color:#dc2626}
.src-dropzone .dz-btn.over{border-style:solid;outline:2px solid currentColor;outline-offset:1px}
.src-item .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--line)}
.src-item.ok .dot{background:#12b76a}
.src-item.err .dot{background:#f04438}
/* V7.9.5：圆点可点（用浏览器打开该源官网），扩大热区但不改视觉大小 */
.src-item .dot{position:relative;cursor:pointer;transition:box-shadow .15s,transform .15s}
.src-item .dot::after{content:"";position:absolute;inset:-8px;border-radius:50%}
.src-item .dot:hover{transform:scale(1.25);box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.src-item.ok .dot:hover{box-shadow:0 0 0 3px rgba(18,183,106,.22)}
.src-item.err .dot:hover{box-shadow:0 0 0 3px rgba(240,68,56,.22)}
.src-item .nm{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-item .cnt{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
/* V7.9.1：侧栏源行「上移/下移」按钮（悬停显示，鼠标/触屏都可点，不依赖拖拽） */
.src-item .mv{display:none;flex:none;gap:2px;align-items:center}
.src-item:hover .mv,.src-item.moving .mv{display:flex}
.src-item .mv button{width:17px;height:17px;padding:0;border-radius:4px;border:1px solid var(--line);
  background:var(--panel);color:var(--sub);font-size:9px;line-height:1;cursor:pointer;display:grid;place-items:center}
.src-item .mv button:hover{color:#fff;background:var(--blue);border-color:var(--blue)}
.src-item .mv button:disabled{opacity:.3;cursor:default;background:var(--panel);color:var(--sub);border-color:var(--line)}
/* V8.0.8：侧栏校对按钮已移除（源行与设置页仍保留校准入口） */
.side-label .sl-right{display:flex;align-items:center;gap:6px;flex:none}
/* V8.0.8：手机/触屏没有 hover —— 源行的上移/下移隐藏，防溢出 */
body.rb-m .src-item .mv{display:flex}
body.rb-m .src-item .mv button[data-mv]{display:none}
body.rb-m .src-item .mv button[data-cal]{width:20px;height:18px;font-size:10px}
/* V7.9.1：分类页签选中时出现的 ‹ › 排序按钮（单击即生效） */
#catRow button .cmv{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:3px;border-radius:4px;
  font-style:normal;font-size:11px;line-height:1;background:color-mix(in srgb,var(--blue) 16%,transparent);
  color:var(--blue);vertical-align:middle}
#catRow button .cmv:hover{background:var(--blue);color:#fff}
.src-item .sw{width:31px;height:18px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:.18s}
.src-item .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s}
.src-item .sw.on{background:var(--blue)}
.src-item .sw.on::after{transform:translateX(13px)}
.side-foot{border-top:1px solid var(--line);padding:9px 9px;display:flex;gap:6px}
.side-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;
  border-radius:8px;font-size:12.5px;color:var(--sub);background:var(--panel2);transition:.15s}
.side-foot button:hover{color:var(--text);background:color-mix(in srgb,var(--blue) 8%,var(--panel2))}
.side-foot button svg{width:13px;height:13px}
.side-foot button.primary{color:var(--blue);font-weight:600}

/* ---------- 主区 ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:9px;padding:11px 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) var(--topMix,72%),transparent);backdrop-filter:blur(14px)}
.tb-title{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:8px;min-width:0;max-width:34%}
.tb-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-title .n{font-size:11.5px;font-weight:500;color:var(--sub);flex:none}
/* V8.0.4：单源视图的「修改 / 更多」小按钮 */
.srcops{display:flex;gap:5px;flex:none}
.srcops button{padding:3px 8px;font-size:11.5px;white-space:nowrap}
body.rb-m .srcops button{padding:3px 7px;font-size:11px}
body.rb-m .tb-title{max-width:42%}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:6px 9px;width:186px;transition:.15s}
.search:focus-within{border-color:color-mix(in srgb,var(--blue) 55%,var(--line));width:250px;background:var(--panel)}
.search svg{width:14px;height:14px;color:var(--sub);flex:none}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
/* V8.0.8：搜索联想（先新闻源、后标题），输入即出、无需回车 */
.q-sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:250;display:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-h);
  max-height:min(64vh,440px);overflow:auto;padding:4px}
.q-sug.on{display:block}
.q-sug .qs-h{font-size:11px;color:var(--sub);padding:5px 8px 3px;letter-spacing:.3px}
.q-sug .qs-i{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12.5px;line-height:1.45}
.q-sug .qs-i:hover,.q-sug .qs-i.cur{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.q-sug .qs-i .qs-d{width:7px;height:7px;border-radius:50%;background:#3fbf6c;flex:none}
.q-sug .qs-i .qs-n{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.q-sug .qs-i .qs-c{font-size:11px;color:var(--sub);flex:none}
.q-sug .qs-i .qs-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.q-sug .qs-i .qs-s{font-size:11px;color:var(--sub);flex:none;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-sug .qs-e{font-size:12px;color:var(--sub);padding:10px 8px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:12.5px;color:var(--sub);transition:.15s;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
.ib{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;color:var(--sub);
  border:1px solid var(--line);background:var(--panel2);transition:.15s;position:relative}
.ib:hover{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.ib.on{color:#fff;background:linear-gradient(135deg,#3b6ef6,#69a6ff);border-color:transparent}
.ib svg{width:16px;height:16px}
.ib.spin svg{animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.content{flex:1;overflow-y:auto;padding:16px 18px 40px;min-height:0}

/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:13px}
.card{background:color-mix(in srgb,var(--panel) var(--panelMix,100%),transparent);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .16s,box-shadow .16s,border-color .16s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.card.speaking{outline:2px solid var(--blue);outline-offset:1px}
.thumb{aspect-ratio:16/9;background:var(--panel2);position:relative;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .thumb img{transform:scale(1.04)}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--blue),#7cb8ff)}
.cbody{padding:10px 12px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.ctop{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub)}
.rk{font-variant-numeric:tabular-nums;font-weight:800;font-size:calc(var(--fs)*.733);color:#fff;background:var(--sub);
  min-width:19px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex:none}
.rk.r1{background:var(--accent)}
.rk.r2{background:var(--accent2)}
.rk.r3{background:linear-gradient(135deg,#f2b21b,#ffd76e)}
.card h3{margin:0;font-size:14px;line-height:1.45;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);margin-top:auto}
.heat{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.badge{padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);
  font-size:10.5px;color:var(--sub);white-space:nowrap}
.acts{position:absolute;top:7px;right:7px;display:flex;gap:4px;opacity:0;transform:translateY(-3px);transition:.16s}
.card:hover .acts,.hcard:hover .acts{opacity:1;transform:none}
.act{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;
  background:rgba(16,20,28,.55);backdrop-filter:blur(6px);transition:.15s}
.act:hover{background:rgba(16,20,28,.82);transform:scale(1.06)}
.act.on{background:linear-gradient(135deg,#f6b73c,#f59e0b);color:#fff}
.act svg{width:14px;height:14px}

/* 行 */
.rows{background:color-mix(in srgb,var(--panel) var(--panelMix,100%),transparent);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background .12s;position:relative;
  content-visibility:auto;contain-intrinsic-size:auto 44px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.row.speaking{background:color-mix(in srgb,var(--blue) 9%,transparent)}
.row .tt{flex:1;min-width:0;font-size:calc(var(--fs)*.933);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row:hover .tt{color:var(--blue)}
.row .ex{font-size:calc(var(--fs)*.767);color:var(--sub);max-width:28%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
/* V6.7：GitHub 条目标题后的中文简介（悬停 title 亦显示） */
.ghzh{color:var(--sub);font-size:.82em;font-weight:400;margin-left:2px}
/* V6.9：中英双显模式的译文小字 */
.cntr{color:var(--blue);font-size:.8em;font-weight:400;margin-left:6px}
.row .heat{flex:none;min-width:58px;text-align:right;font-size:calc(var(--fs)*.8)}
.row .acts{position:static;opacity:0;transform:none;flex:none}
.row:hover .acts{opacity:1}
.row .act{background:var(--panel2);color:var(--sub);border:1px solid var(--line)}

/* ---- 分类导航（侧栏） ---- */
.cat-row{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 2px}
.cat-row button{padding:4px 10px;border-radius:14px;font-size:12px;color:var(--sub);
  background:var(--panel2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.cat-row button:hover{color:var(--text);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.cat-row button.on{background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--blue);
  border-color:color-mix(in srgb,var(--blue) 42%,var(--line));font-weight:600}
.cat-row button em{font-style:normal;opacity:.6;font-size:10.5px;margin-left:2px}

/* ---- 看板视图：多列源面板（参考 rebang.today 看板） ---- */
/* V7.9.7：看板列数/行数可设（一行 4~12 个、一屏 2~6 个），卡片宽高可拖边缘调节 */
.bgrid{display:grid;gap:18px;align-items:stretch;justify-content:flex-start;padding-bottom:6px;overflow-x:auto;
  grid-template-columns:repeat(var(--bcols,4),minmax(0,1fr))}
.bcard{position:relative;background:color-mix(in srgb,var(--panel) var(--panelMix,100%),transparent);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  height:var(--bcardh,480px);display:flex;flex-direction:column;
  /* V8.0.0 流畅度：视口外的看板卡片跳过排版/绘制，100+ 源同屏也不卡 */
  content-visibility:auto;contain-intrinsic-size:auto var(--bcardh,480px)}
/* 拖拽热区：右侧改宽度、底部改高度；动一个，所有板块同步（网格统一尺寸） */
.brz{position:absolute;z-index:4;opacity:0;transition:background .15s,opacity .15s;touch-action:none}
.bcard:hover .brz{opacity:1}
.brz-r{top:0;right:0;width:9px;height:100%;cursor:ew-resize}
.brz-b{left:0;bottom:0;height:9px;width:100%;cursor:ns-resize}
.brz-r:hover,.brz-b:hover{background:color-mix(in srgb,var(--blue) 30%,transparent)}
body.rb-resizing{cursor:ew-resize;user-select:none}
body.rb-resizing.col-resize{cursor:ew-resize}
body.rb-resizing.row-resize{cursor:ns-resize}
body.rb-resizing *{user-select:none !important}
.bgrid-tip{grid-column:1/-1;font-size:11.5px;color:var(--sub);padding:0 2px 2px}
.bhead{flex:none;display:flex;align-items:center;gap:7px;padding:9px 12px;
  border-bottom:1px solid var(--line2);cursor:pointer;background:transparent}
.bhead:hover{background:var(--panel2)}
.bhead .bdot{width:8px;height:8px;border-radius:3px;background:var(--blue);flex:none}
.bhead .bnm{font-weight:700;font-size:calc(var(--fs)*.9);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:26px}
.bhead .bbadge{flex:0 1 auto;min-width:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(var(--fs)*.7);padding:1.5px 7px;border-radius:6px;
  background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue)}
.bhead .bcnt{margin-left:auto;flex:none;font-size:calc(var(--fs)*.733);color:var(--sub)}
/* V8.0.4：看板卡片右上角「修改新闻源 / 更多」——不改去看板，就地弹出校准界面 */
.bhead .bact{flex:none;display:flex;gap:3px;margin-left:2px;opacity:.55;transition:opacity .15s}
.bcard:hover .bhead .bact{opacity:1}
.bhead .bact button{width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--sub);font-size:12px;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center}
.bhead .bact button:hover{color:var(--blue);border-color:var(--blue);
  background:color-mix(in srgb,var(--blue) 10%,var(--panel))}
body.rb-m .bhead .bact{opacity:1}
body.rb-m .bhead .bact button{width:26px;height:26px;font-size:13px}
/* 手机窄卡片：分类徽章和条数让位给「名称 + 修改/更多」，避免挤成一团 */
body.rb-m .bhead .bbadge{display:none}
body.rb-m .bhead .bcnt{font-size:11px}
.bbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.bbody::-webkit-scrollbar{width:6px}
.bbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.bbody::-webkit-scrollbar-thumb:hover{background:var(--sub)}
.bempty{padding:22px 12px;text-align:center;color:var(--sub);font-size:12.5px}
.bfoot{flex:none;padding:8px 12px;border-top:1px solid var(--line2);text-align:center;
  font-size:calc(var(--fs)*.8);color:var(--blue);cursor:pointer;background:transparent}
.bfoot:hover{background:color-mix(in srgb,var(--blue) 9%,var(--panel2));font-weight:600}
.bitem{display:flex;align-items:flex-start;gap:8px;padding:6.5px 12px;cursor:pointer;font-size:calc(var(--fs)*.867);line-height:1.5}
.bitem+.bitem{border-top:1px solid var(--line2)}
.bitem:hover{background:var(--panel2)}
.bitem .rk{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--panel2);color:var(--sub);margin-top:2px}
.bitem .rk.t1{background:var(--accent);color:#fff}
.bitem .rk.t2{background:var(--accent2);color:#fff}
.bitem .rk.t3{background:#ffa940;color:#fff}
.bitem .bt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.bitem .bt.hast{-webkit-line-clamp:3}
/* V7.8.5：英文标题下方浅灰中文翻译行（小一号字，不抢视觉重心，不挤摘要/热度/来源） */
.zh-tr{display:block;font-size:calc(var(--fs)*.767);color:var(--sub);font-weight:400;line-height:1.45;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-mode .zh-tr,.card .zh-tr,.hcard .zh-tr{white-space:normal;text-overflow:clip;word-break:break-all}
.tr-tag{opacity:.72;font-weight:400}
.card h3 .zh-tr{font-size:12px}
.hcard h3 .zh-tr{font-size:12px}
.bitem .bh{flex:none;font-size:calc(var(--fs)*.733);color:var(--sub);margin-top:3px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- 列表视图：两行标题、完整显示 ---- */
.list-mode .row{align-items:flex-start;padding:11px 14px;gap:11px}
.list-mode .row .tt{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px}
.list-mode .row .acts{align-self:center}
.list-mode .rk{align-self:flex-start;margin-top:1px}
.row .act:hover{background:var(--panel);color:var(--text);transform:none}
.row .act.on{background:linear-gradient(135deg,#f6b73c,#f59e0b);color:#fff;border-color:transparent}

/* 单源 有图 */
.hlist{display:flex;flex-direction:column;gap:9px}
.hcard{display:flex;gap:13px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--line);
  border-radius:12px;padding:10px;box-shadow:var(--shadow);cursor:pointer;transition:.16s;position:relative}
.hcard:hover{border-color:color-mix(in srgb,var(--blue) 30%,var(--line));box-shadow:var(--shadow-h);transform:translateY(-1px)}
.hcard.speaking{outline:2px solid var(--blue)}
.hthumb{width:136px;height:84px;border-radius:8px;overflow:hidden;flex:none;background:var(--panel2);position:relative}
.hthumb img{width:100%;height:100%;object-fit:cover}
.hbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:1px 0}
.hbody h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:64px}
.hbody .ex{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{margin-top:auto;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--sub)}

.group-h{display:flex;align-items:center;gap:8px;margin:16px 2px 9px;font-size:12.5px;color:var(--sub);font-weight:600}
.group-h:first-child{margin-top:0}
.group-h i{width:3px;height:13px;border-radius:2px;background:var(--blue);display:block}
.group-h em{font-style:normal;color:var(--sub);font-weight:400;font-size:11.5px}

.empty{padding:66px 20px;text-align:center;color:var(--sub);font-size:13.5px;line-height:2}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.45}
.err-bar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,#f04438 8%,var(--panel));
  border:1px solid color-mix(in srgb,#f04438 26%,var(--line));color:#b42318;border-radius:10px;
  padding:9px 13px;font-size:12.5px;margin-bottom:12px}
html[data-theme="dark"] .err-bar{color:#ffb4ab}
.err-bar button{margin-left:0;color:inherit;font-weight:600;font-size:12px;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.err-bar .eb-btns{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.err-bar .eb-more{margin-left:0}
/* M8.0：通知条尾部关闭图标 */
.err-bar .eb-x{margin-left:0;text-decoration:none;border:1px solid color-mix(in srgb,#f04438 30%,var(--line));
  border-radius:7px;padding:1px 7px;font-size:12px;line-height:1.5}
.err-bar .eb-x:hover{background:color-mix(in srgb,#f04438 14%,var(--panel))}
/* V7.8：失败源完整清单展开面板 */
.err-list{background:color-mix(in srgb,#f04438 5%,var(--panel));border:1px solid color-mix(in srgb,#f04438 22%,var(--line));
  border-top:0;border-radius:0 0 10px 10px;padding:4px 13px;margin:-6px 0 12px;max-height:320px;overflow:auto}
.err-list .er{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.err-list .er:last-child{border-bottom:0}
/* ---------- V7.9.3：推广 · 推荐页 ---------- */
.adwrap{max-width:760px;margin:0 auto;padding:2px 0 20px}
.ad-hero{background:linear-gradient(135deg,color-mix(in srgb,#ff7a45 16%,var(--panel)),color-mix(in srgb,#ff4d6d 12%,var(--panel)));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ad-hero-t{font-size:17px;font-weight:800;letter-spacing:.3px;line-height:1.5;color:var(--text)}
.ad-hero-s{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.7}
.ad-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,#ff5f6d,#ff8a3d);padding:2px 7px;border-radius:6px;flex:none}
.ad-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);cursor:pointer;transition:.16s}
.ad-card:hover{box-shadow:var(--shadow-h);transform:translateY(-1px)}
.ad-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ad-card-badge{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.ad-card-t{font-size:15.5px;font-weight:700;line-height:1.55}
.ad-card-d{font-size:13px;color:var(--sub);line-height:1.7;margin-top:6px}
.ad-card-go{margin-top:12px;display:inline-block;font-size:13px;font-weight:700;color:#fff;border-radius:9px;
  padding:7px 14px;background:linear-gradient(135deg,#ff6a4d,#ff9147)}
.ad-banner{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;flex-wrap:wrap}
.ad-bn-t{font-size:14px;font-weight:700}
.ad-bn-d{font-size:12.5px;color:var(--sub);flex:1 1 180px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-bn-go{font-size:12.5px;font-weight:700;color:var(--accent);flex:none}
.ad-row{cursor:pointer}
.ad-row .rn{display:block;font-size:12px;color:var(--sub);margin-top:3px;font-weight:400}
.ad-row .rb-go{font-size:12.5px;font-weight:700;color:var(--accent);flex:none}
.ad-foot{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.ad-qv{cursor:pointer;font-weight:700;color:var(--text);border:1px dashed var(--line);border-radius:8px;padding:4px 9px}
.ad-qv:hover{background:var(--panel2)}
.ad-tip{opacity:.85}
.err-list .en{font-weight:600;color:var(--text);flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err-list .em{color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.err-list .er button{flex:none;margin-left:0;color:var(--sub);font-weight:500;font-size:11.5px;padding:1px 8px;
  border:1px solid var(--line);border-radius:6px;text-decoration:none}
/* V7.8：分类管理 ↑↓ 排序按钮 */
.cmi .cup,.cmi .cdn{border:none;background:none;color:var(--sub);cursor:pointer;font-size:11px;padding:0}
/* V7.9：指针拖拽排序（鼠标直接拖 / 触屏长按拖） */
body.ptr-sorting, body.ptr-sorting *{cursor:grabbing!important;user-select:none!important}
.ptr-ghost{position:fixed;z-index:99999;pointer-events:none;opacity:.9;box-shadow:0 10px 28px -8px rgba(16,24,40,.45);
  border-radius:8px;background:var(--panel);overflow:hidden}
.ptr-drag{opacity:.35}
.ptr-over{outline:2px dashed var(--blue);outline-offset:-2px;border-radius:8px}
.src-item,.srcrow,#catRow button[data-c]{touch-action:pan-y}
.skeleton{height:96px;border-radius:12px;background:linear-gradient(90deg,var(--panel2) 25%,var(--line2) 37%,var(--panel2) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* 朗读条 */
.player{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);
  display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--panel) 96%,transparent);
  border:1px solid var(--line);border-radius:14px;padding:9px 14px;box-shadow:0 18px 46px -16px rgba(16,24,40,.4);
  transition:.24s;z-index:70;backdrop-filter:blur(10px)}
.player.on{transform:translateX(-50%) translateY(0)}
.player .pi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#3b6ef6,#69a6ff);flex:none}
.player .pi svg{width:15px;height:15px}
.player .tx{font-size:12.5px;color:var(--sub);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player input[type=range]{width:96px;accent-color:var(--blue)}
.player .rate{font-size:11.5px;color:var(--blue);font-weight:700;min-width:34px;text-align:right}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.44);backdrop-filter:blur(2px);z-index:90;
  display:none;align-items:center;justify-content:center;padding:26px}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(820px,100%);
  max-height:calc(100vh - 52px);display:flex;flex-direction:column;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.5);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
/* V8.0.2：标题与分类页签固定常显（内容再多也不会把「常规/外观/新闻源…」顶出视野） */
.modal-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;
  flex:0 0 auto;position:relative;z-index:3;background:var(--panel)}
.modal-h h2{margin:0;font-size:15.5px}
.modal-h .x{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--sub)}
.modal-h .x:hover{background:var(--panel2);color:var(--text)}
.tabs{display:flex;gap:4px;padding:9px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;flex:0 0 auto;position:sticky;top:0;z-index:2;
  background:var(--panel)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 13px;font-size:13px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;flex:none;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.modal-b{padding:16px 18px;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
/* V8.0.2：源分类多选（按钮 + 浮层勾选） */
.catsel{flex:none;font-size:11px;padding:2px 7px;border-radius:6px;cursor:pointer;max-width:132px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;
  background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--blue);border:1px solid transparent}
.catsel:hover{border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.catpick-pop{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 18px 44px -18px rgba(0,0,0,.45);padding:8px;width:250px}
.catpick-pop .cph{font-size:11.5px;color:var(--sub);padding:2px 4px 6px;line-height:1.5}
.catpick-pop .cpb{max-height:244px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.catpick-pop label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);
  padding:4px 6px;border-radius:6px;cursor:pointer}
.catpick-pop label:hover{background:var(--panel2)}
.catpick-pop .cpf{display:flex;justify-content:flex-end;gap:6px;padding-top:6px;margin-top:4px;border-top:1px dashed var(--line2)}
.field{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.field:last-child{border-bottom:0}
.field .lb{width:118px;flex:none;font-size:13.5px;font-weight:500;position:relative}
.field .hint{font-size:11.5px;color:var(--sub);margin-top:3px;font-weight:400;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
/* V7.9.6：说明文字平时只留一行（省略号），鼠标移上去在下方浮层里显示全文；触屏点一下也展开 */
@media (hover:hover){
  .field .hint:hover{white-space:normal;overflow:visible;position:absolute;left:0;top:100%;width:250px;
    z-index:40;background:var(--panel,#fff);color:var(--text,#222);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;box-shadow:0 8px 22px rgba(0,0,0,.16);text-align:left}
}
.field .hint.on{white-space:normal;overflow:visible}
.field .ctl{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:6px 12px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--panel2);color:var(--sub);transition:.15s}
.pill:hover{border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.mini{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--sub);background:var(--panel2)}
.mini:hover{color:var(--text);border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.mini.danger:hover{color:#fff;background:#f04438;border-color:#f04438}
.srcrow{display:flex;align-items:center;gap:7px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:7px;background:var(--panel2)}
.srcrow .sw{width:29px;height:17px;border-radius:20px;background:var(--line);position:relative;flex:none;cursor:pointer}
.srcrow .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.18s}
.srcrow .sw.on{background:var(--blue)}
.srcrow .sw.on::after{transform:translateX(12px)}
.srcrow .nm{width:92px;flex:none;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow input.url{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:7px;
  padding:5px 8px;font-size:11.5px;outline:none}
.srcrow input.url:focus{border-color:color-mix(in srgb,var(--blue) 55%,var(--line))}
.srcrow input.num{width:44px;border:1px solid var(--line);background:var(--panel);border-radius:7px;
  padding:5px 6px;font-size:11.5px;text-align:center;outline:none}
.srcrow .ops{display:flex;gap:2px}
.srcrow .ops button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--sub);font-size:11.5px}
.srcrow .ops button:hover{background:var(--panel);color:var(--text)}
/* V6.2 拖拽换分组高亮 + 分类管理块 */
.dropok{outline:2px solid var(--blue)!important;outline-offset:1px;opacity:.85}
.srcrow[draggable="true"]:active{opacity:.6}
.tip{font-size:12px;line-height:1.7;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;margin-bottom:12px}
.tip b{color:var(--blue)}
.addbox{border:1px dashed color-mix(in srgb,var(--blue) 40%,var(--line));border-radius:10px;padding:12px;margin-top:6px;background:var(--panel2)}
.addbox .r{display:flex;gap:8px;margin-bottom:8px}
.addbox input,.addbox select{border:1px solid var(--line);background:var(--panel);border-radius:7px;
  padding:7px 9px;font-size:12.5px;outline:none;min-width:0}
.about{font-size:13px;line-height:1.9;color:var(--sub)}
.about b{color:var(--text)}
.qrbox{display:flex;gap:16px;align-items:flex-start;margin-top:12px;flex-wrap:wrap}
.qrimg{width:150px;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  display:grid;place-items:center;overflow:hidden;font-size:12px;color:var(--sub);text-align:center;padding:6px}
.qrimg img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:#1b2029;color:#fff;
  padding:9px 16px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:200;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6);max-width:70vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:244px;z-index:60;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .search{width:130px}.search:focus-within{width:160px}
  .tb-title{max-width:40%}
}

/* ============ M8.2：手机 UA（Android / iPhone）自动套用 APK 版排版 ============ */
body.rb-m .app{height:100vh;height:100dvh;grid-template-columns:1fr}
body.rb-m .topbar{gap:6px;padding:8px 10px;position:relative}
body.rb-m .tb-title{font-size:15px;max-width:none;flex:1 1 auto;min-width:0}
body.rb-m .tb-title .n{display:none}
body.rb-m .spacer{display:none}
body.rb-m #rbMenu{flex:none}
/* 搜索：默认只有一个图标，点开才展开成输入框 */
body.rb-m .search{width:34px;height:34px;min-width:34px;padding:0;justify-content:center;flex:none;cursor:pointer}
body.rb-m .search input{display:none;width:0;padding:0}
body.rb-m .search.rbOpen{position:absolute;left:8px;right:8px;top:6px;width:auto;min-width:0;height:40px;
  padding:0 10px;justify-content:flex-start;z-index:90;background:var(--panel);box-shadow:0 8px 24px -10px rgba(16,24,40,.4)}
body.rb-m .search.rbOpen input{display:block;width:100%;font-size:16px}
/* 视图切换：只留图标 */
body.rb-m .seg{padding:2px;flex:none}
body.rb-m .seg button{padding:0;width:32px;height:30px;display:grid;place-items:center;font-size:0}
body.rb-m .seg button svg{width:16px;height:16px;display:block}
body.rb-m #btnFit,body.rb-m #btnFb{display:none!important}
body.rb-m .content{padding:10px 10px 84px;overflow-x:hidden}
/* 右下悬浮竖排：朗读 / 刷新 / 翻译 / 设置（与 APK 端一致） */
body.rb-m #rbRail{position:fixed;right:9px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;z-index:57}
body.rb-m #rbRail .ri{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--sub);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
  box-shadow:0 6px 18px -8px rgba(16,24,40,.5);backdrop-filter:blur(10px);position:relative}
body.rb-m #rbRail .ri:active{transform:scale(.94)}
body.rb-m #rbRail .ri svg{width:17px;height:17px}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };

/* V6.7：云服务 SDK（建议反馈上云；加载失败只影响建议功能，主功能不受影响） */
let CLOUD=null, CLOUD_ERR='';
const CLOUD_CFG={
  endpoint: 'https://hotboard-mobile.app.workbuddy.host',
  oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
  publishableKey: 'wbpk_2WYvs4efiBXDiTR7alG7vD_oigh5tWGHt21QUbb2z8dG3O55h4fkOul',
};
try{
  if(window.WorkBuddyCloud) CLOUD = WorkBuddyCloud.createWorkBuddyCloud(CLOUD_CFG);
}catch(e){ CLOUD_ERR=(e&&e.message)||String(e); console.warn('cloud init failed', e); }
/* V7.2/M5.5：云端自愈——个别会话初始化失败后，打开建议面板时再试一次，并显示真实原因 */
function ensureCloud(){
  if(CLOUD) return true;
  try{
    if(window.WorkBuddyCloud&&window.WorkBuddyCloud.createWorkBuddyCloud){
      CLOUD=WorkBuddyCloud.createWorkBuddyCloud(CLOUD_CFG); CLOUD_ERR='';
    }
  }catch(e){ CLOUD_ERR=(e&&e.message)||String(e); }
  return !!CLOUD;
}
function cloudErrMsg(){
  if(window.WorkBuddyCloud) return '云端组件初始化失败'+(CLOUD_ERR?'：'+CLOUD_ERR:'');
  return '云端组件未加载，请刷新页面重试';
}
function deviceId(){
  let id=null;
  try{ id=localStorage.getItem('hb_device_id'); }catch(_){}
  if(!id){ id='dev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem('hb_device_id', id); }catch(_){}}
  return id;
}

const state = {
  cfg:{settings:{},sources:[]},
  data:{}, favs:[], hist:[],
  view:'all', filter:'', loading:new Set(),
  tab:'general', addOpen:false,
  zh:{}, showZh:false, transBusy:false,
  speak:{list:[],i:0,on:false,paused:false},
  autoHidden:[],
  cat:'全部',          // 当前分类：全部/综合/…（用户自定义）
  catRen:'',           // V6.2 分类改名/新建中的分类名（''=未在编辑，'__new__'=新建）
  layout:'board',      // 布局：board 看板 / list 列表
  _errClosed:false,    // V7.9.3：本次运行已手动关闭「失败通知」，换分类/重渲染不再弹
};

/* ---------------- V7.9.3：本地快照，打开即显示上次抓到的内容 ----------------
   三端（桌面 exe / 网页版 / 安卓 WebView）共用这套逻辑：
   每次拿到数据就把「源 → 条目」落进 localStorage，下次冷启动先用它渲染，
   等接口返回新内容后整页替换。这样哪怕网络/服务器慢，也不会白屏等十几秒。 */
const SNAP_KEY='hb_snap_v1';
let _snapT=0;
function saveSnap(){
  const now=Date.now();
  if(now-_snapT<1200) return;      // 节流：分批返回时别写十几次
  _snapT=now;
  try{
    const d={};
    Object.keys(state.data||{}).forEach(k=>{
      const v=state.data[k]||{};
      const its=(v.items||[]);
      if(!its.length) return;
      d[k]={items:its.slice(0,60),ts:v.ts||0};
    });
    if(!Object.keys(d).length) return;
    localStorage.setItem(SNAP_KEY,JSON.stringify({v:1,at:now,d:d}));
  }catch(e){}
}
function loadSnap(){
  try{
    const j=JSON.parse(localStorage.getItem(SNAP_KEY)||'null');
    return (j&&j.d)?j:null;
  }catch(e){ return null; }
}

/* V6.2：分类由用户自己管理（存配置 settings.cats），CATS 是动态的兜底默认 */
let CATS = ['全部','综合','财经','娱乐','科技','社区','小说','推广','宏观政策','前沿 AI','生物前沿','心理学刊','历史深度','楼市基建','能源电力','创业投融资','学术顶刊','汽车产业','材料科学刊','环境生态刊','公共卫生刊','神经科学刊','物理天文刊','化学化工刊','农林食品刊','计算机理论刊','法学与治理刊','城市规划刊','药学与药理刊'];
/* M8.4：已整类下线的分类，任何来源（老配置/云端同步/旧客户端）带回来都不显示 */
const DROP_CATS = ['国际新闻','币圈','医疗期刊','航天军工','消费品牌','跨境出海','体育赛事','哲学社会刊','产业赛道'];
const catsOnly = () => CATS.slice(1);
/* V6.7：分类可隐藏（settings.hideCats），导航栏只显示未隐藏的分类；源和分类本身都保留 */
/* V8.0.1：版本自带的 17 个默认隐藏分类——只要用户没点过「恢复显示」，即使配置/本机副本里
   的 hideCats 被旧数据冲掉，也一律按隐藏处理（旧版客户端、旧缓存页都顶不回来）。 */
const DEFAULT_HIDDEN = ['前沿 AI','生物前沿','心理学刊','历史深度','能源电力','创业投融资','学术顶刊',
  '汽车产业','材料科学刊','公共卫生刊','神经科学刊','物理天文刊','化学化工刊','农林食品刊',
  '计算机理论刊','法学与治理刊','药学与药理刊'];
function hiddenCats(){
  const s=(state.cfg&&state.cfg.settings)||{};
  const h=(Array.isArray(s.hideCats)?s.hideCats:[]).filter(x=>typeof x==='string');
  const unh=(Array.isArray(s.unhideCats)?s.unhideCats:[]).filter(x=>typeof x==='string');
  DEFAULT_HIDDEN.forEach(c=>{
    if(h.indexOf(c)<0 && unh.indexOf(c)<0 && CATS.indexOf(c)>=0) h.push(c);
  });
  return h;
}
function visibleCatsList(){ return CATS.filter(c=>c==='全部'||hiddenCats().indexOf(c)<0); }
/* V8.0.0：推广分类（广告位）不可隐藏/删除，只能排序；本地分类要设了地区才出现，且可隐藏/删除 */
const PROTECT_CAT = '推广';
function hasRegion(){ return ((state.cfg&&state.cfg.sources)||[]).some(s=>s&&s.id==='region_news'); }
function regionVisible(){ return hasRegion() && hiddenCats().indexOf('本地')<0; }
/* 删除「本地」分类：清空地区设置并移除 region_news 源（分类里不会再出现） */
function clearRegion(){
  const st=(state.cfg.settings=state.cfg.settings||{});
  st.region='';
  state.cfg.sources=state.cfg.sources.filter(s=>s&&s.id!=='region_news');
  const h=hiddenCats(), i=h.indexOf('本地');
  if(i>=0){ h.splice(i,1); st.hideCats=h; }
  if(state.cat==='__region'){ state.cat='全部'; state.view='all'; }
  saveCfg(); refreshCats(); renderCats(); renderSidebar();
  if($('#mask')&&$('#mask').classList.contains('on')) renderModal();
  render(); toast('已删除「本地」分类，地区设置已清空（可到设置里重新填）');
}
function setHiddenCat(c,hide){
  const st=(state.cfg.settings=state.cfg.settings||{});
  const h=hiddenCats(), i=h.indexOf(c);
  if(hide && i<0) h.push(c);
  if(!hide && i>=0) h.splice(i,1);
  st.hideCats=h;
  if(hide && state.cat===c) state.cat='全部';   // 正看着的分类被隐藏 → 回退「全部」
}
function refreshCats(){
  const cs = (state.cfg && state.cfg.settings && Array.isArray(state.cfg.settings.cats) && state.cfg.settings.cats.length)
    ? state.cfg.settings.cats : CATS.slice(1);
  /* M9.2：兜底——源用到的分类若不在清单里（旧客户端/旧配置），自动补进 CATS，
     否则 srcCat() 会把它算成「综合」，界面上看就是新分类消失、综合源数暴涨 */
  const extra=[];
  ((state.cfg && state.cfg.sources) || []).forEach(s=>{
    splitCat(s && s.cat).forEach(c=>{
      if(c && cs.indexOf(c)<0 && DROP_CATS.indexOf(c)<0 && extra.indexOf(c)<0) extra.push(c);
    });
  });
  CATS = ['全部'].concat(cs.filter(c=>DROP_CATS.indexOf(c)<0), extra);
}

function splitCat(raw){
  return String(raw==null?'':raw).split(/[,，、;；/]+/).map(x=>x.trim()).filter(Boolean);

function srcCats(s){
  const cs=splitCat(s&&s.cat).filter(c=>CATS.includes(c));

function srcCat(s){ return srcCats(s)[0]; }
function catHas(s,c){ return srcCats(s).indexOf(c)>=0; }
function catLabel(s){ return srcCats(s).join(' · '); }
function setSrcCats(s,arr){
  const uniq=[];
  (arr||[]).forEach(c=>{ if(c&&uniq.indexOf(c)<0) uniq.push(c); });

function inCat(s){
  /* M8.0：修复「隐藏分类后侧边栏仍显示该分类的源」——全部/总排行视图过滤掉已隐藏分类的源 */
  const hid=hiddenCats();

/* ---------------- V7.9 指针拖拽排序 ----------------
   用 pointer 事件自实现（浏览器 HTML5 拖拽在 Edge 应用窗口里时常失灵）：
   鼠标左键按住移动 6px 即开始拖动；触屏长按 0.35 秒后可拖。
   松手时：先看落在 cfg.targets（换分组/隐藏/删除等），再落在同类行上=排序。 */
function ptrSort(box,cfg){
  if(box._ptrBound) return; box._ptrBound=true;
  const axis=cfg.axis||'y';
  let st=null;
  function begin(e){
    if(st.started) return;
    st.started=true;
    window._ptrDragging=1;      /* V8.0.8：拖动期间暂停重绘，否则后台刷新一渲染就把被拖的行换掉，拖拽直接失效 */
    document.body.classList.add('ptr-sorting');
    const g=st.item.cloneNode(true);
    g.className+=' ptr-ghost';
    g.style.width=st.item.offsetWidth+'px';
    g.style.height=st.item.offsetHeight+'px';
    document.body.appendChild(g);
    st.ghost=g; st.item.classList.add('ptr-drag');
    if(cfg.onStart) cfg.onStart(st.item);
    placeGhost(e);
  }
  function placeGhost(e){
    if(st.ghost){ st.ghost.style.left=(e.clientX+12)+'px'; st.ghost.style.top=(e.clientY+8)+'px'; }
  }
  function clearHi(){ document.querySelectorAll('.ptr-over').forEach(n=>n.classList.remove('ptr-over')); }
  function cleanup(){
    if(st){
      if(st.ghost) st.ghost.remove();
      st.item.classList.remove('ptr-drag');
      clearHi();
      document.body.classList.remove('ptr-sorting');
      if(st.started) window._ptrJustDropped=Date.now();
      window._ptrDragging=0;
      if(cfg.onEnd) cfg.onEnd(st.item);
      /* 拖动期间被推迟的重绘，松手后补一次 */
      if(window._ptrDefer){
        window._ptrDefer=0;
        setTimeout(()=>{ try{ renderSidebar(); renderCats(); }catch(e){} }, 30);
      }
    }
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',cancel);
    st=null;
  }
  function mv(e){
    if(!st) return;
    if(!st.started){
      if(e.pointerType==='mouse'){
        if(Math.abs(e.clientX-st.x)>6||Math.abs(e.clientY-st.y)>6) begin(e);
        else return;
      }else return;
    }
    e.preventDefault();
    placeGhost(e);
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const hit=t&&t.closest?t.closest(cfg.item):null;
    clearHi();
    st.extra=null; st.target=null;
    if(cfg.targets){
      for(const tg of cfg.targets){
        const el2=t&&t.closest?t.closest(tg.sel):null;
        if(el2){ st.extra={tg,el:el2}; el2.classList.add('ptr-over'); return; }
      }
    }
    if(hit&&hit!==st.item&&box.contains(hit)){
      st.target=hit;
      const r=hit.getBoundingClientRect();
      st.before= axis==='y'? e.clientY<r.top+r.height/2 : e.clientX<r.left+r.width/2;
      hit.classList.add('ptr-over');
    }
  }
  function up(e){
    if(st&&st.started){
      if(st.extra){ st.extra.tg.onDrop(st.extra.el,st.item,e); }
      else if(st.target&&cfg.onDrop){ cfg.onDrop(st.item,st.target,!!st.before,e); }
    }
    cleanup();
  }
  function cancel(){ cleanup(); }
  box.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0) return;
    const item=e.target.closest(cfg.item);
    if(!item||!box.contains(item)) return;
    if(cfg.canDrag&&!cfg.canDrag(item,e.target)) return;
    if(st) cleanup();
    st={item,x:e.clientX,y:e.clientY,started:false};
    document.addEventListener('pointermove',mv,{passive:false});
    document.addEventListener('pointerup',up);
    document.addEventListener('pointercancel',cancel);
    if(e.pointerType!=='mouse') st.lt=setTimeout(()=>begin(e),350);
  });
  box.addEventListener('dragstart',e=>{ if(st&&st.started) e.preventDefault(); });  // 指针拖拽期间屏蔽原生拖拽
  box.addEventListener('selectstart',e=>{ if(st&&st.started) e.preventDefault(); });
}
/* V7.9.1：一键上移/下移（不依赖拖拽，单击必定生效）
   onlyVisible=true 时按「侧栏当前分类下可见的源」移动，避免跨分类错位 */
function moveSourceStep(id,dir,onlyVisible){
  const arr=state.cfg.sources;
  const vis=onlyVisible?arr.filter(s=>s.enabled&&inCat(s)):arr;
  const vi=vis.findIndex(s=>s.id===id);
  if(vi<0) return;
  const nb=vis[vi+dir];
  if(!nb){ toast(dir<0?'已经是最上面了':'已经是最下面了'); return; }
  const i=arr.findIndex(s=>s.id===id);
  const [m]=arr.splice(i,1);
  let k=arr.findIndex(s=>s.id===nb.id);
  if(k<0){ arr.splice(i,0,m); return; }
  if(dir>0) k+=1;
  arr.splice(k,0,m);
  saveCfg(); renderSidebar();
  if($('#mask')&&$('#mask').classList.contains('on')) renderModal();
  render();
  toast('已'+(dir<0?'上移':'下移')+'「'+(m.name||'')+'」');

function moveSource(fromId,toId,before){  const arr=state.cfg.sources;
  const fi=arr.findIndex(x=>x.id===fromId), ti=arr.findIndex(x=>x.id===toId);
  if(fi<0||ti<0||fi===ti) return;
  const [m]=arr.splice(fi,1);
  let ins=arr.findIndex(x=>x.id===toId);
  if(ins<0){ arr.splice(fi,0,m); return; }
  if(!before) ins+=1;
  arr.splice(ins,0,m);
  saveCfg(); renderSidebar(); render(); toast('已调整顺序');

/* V8.0.6：api 加固——响应不是 JSON（网关超时/服务重启）或网络抖动时自动重试一次，
   并把失败原因抛给调用方显示，前端不再笼统报「网络错误」 */
const api=(p,o)=>{
  const once=()=>fetch(p,o).then(r=>r.text()).then(t=>{
    try{ return JSON.parse(t); }
    catch(e){ throw new Error('服务返回异常(HTTP '+r.status+')，请重试'); }
  });
  const doIt=()=>once().catch(e=>{
    const m=String((e&&e.message)||e);
    const isGet=!o||!o.method||String(o.method).toUpperCase()==='GET';
    const bad=m.indexOf('Failed to fetch')>=0||m.indexOf('NetworkError')>=0||m.indexOf('服务返回异常')>=0||m.indexOf('load failed')>=0;
    if(isGet&&bad){
      return new Promise(res=>setTimeout(res,700)).then(once).catch(e2=>{
        throw new Error('服务无响应，请稍后重试（'+String((e2&&e2.message)||e2).slice(0,70)+'）');
      });
    }
    throw (e instanceof Error)?e:new Error(m);
  });
  return doIt();
};

/* 把抓取地址换算成「人能看的官网地址」：接口/订阅地址回退到站点根 */
function srcHomeUrl(s){
  if(!s) return '';
  const k=String(s.id||'').toLowerCase();
  if(SRC_HOME[k]) return SRC_HOME[k];
  const raw=s.home||s.url||'';
  if(!raw) return '';
  try{
    const o=new URL(raw, location.href);
    if(/^api\./i.test(o.hostname)) return o.protocol+'//'+o.hostname.replace(/^api\./i,'')+'/';
    if(/(^|\/)(api|ajax|rss|feed)(\/|$)/i.test(o.pathname)
       || /\.(json|xml|rss)(\?|$)/i.test(o.pathname+o.search)) return o.protocol+'//'+o.hostname+'/';
    return raw;
  }catch(e){ return raw; }
}

async function openInBrowser(u){
  if(!u) return false;

  if(srcLocalHost()){
    try{
      const r=await api('/api/openurl',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({url:u})});
      if(r&&r.ok) return true;
    }catch(e){}
  }
  try{ const w=window.open(u,'_blank'); if(w) return true; }catch(e){}
  try{ location.href=u; return true; }catch(e){}
  return false;
}

/* M9.1：只有侧边栏显示的分类才抓取（隐藏分类的源关闭且不参与刷新/启动检测） */
const fetchable=()=>{ const hid=hiddenCats();
  return enabled().filter(s=>!srcCats(s).some(c=>hid.indexOf(c)>=0)); };

function loadSources(srcs, force){
  const list=srcs.filter(s=>s&&s.id);
  if(!list.length) return Promise.resolve();
  list.forEach(s=>state.loading.add(s.id));
  /* 分批请求：每批 16 个源合一个请求，正好喂满后端 24 线程抓取池；
     浏览器同域只有 6 个并发连接，逐源发请求会让 149 个源排队变慢。
     每批返回立即渲染（渐进显示，先到先看）。 */
  /* V7.9.2：首批只放 8 个源，先让首屏出来；后面仍按 16 个一批补满（24 线程抓取池） */
  const groups=[];
  for(let i=0, n=8; i<list.length; i+=n, n=16) groups.push(list.slice(i,i+n));
  const one=(grp,gi)=>{
    const ids=grp.map(s=>s.id).join(',');
    /* V7.9.2：首批最多等 4 秒出内容，后面的批次只等 1.2 秒——
       没抓到的源走下面「3 秒静默跟进」，不拖住整页 */
    return api('/api/hot?ids='+encodeURIComponent(ids)+(force?'&force=1':'')
      +'&wait='+(gi===0?4:1.2))
      .then(r=>{
        Object.assign(state.data,r.sources||{});
        /* 还没抓到数据的源继续转圈（后台在抓，跟进轮会补上） */
        (r.stale||[]).forEach(id=>{
          const d=r.sources[id];
          if(!d || !(d.items||[]).length) state.loading.add(id);
        });
        /* 缓存秒开：过期的源后台刷新中，3 秒后静默跟进拉新数据（最多 3 轮） */
        if(r.stale && r.stale.length && !force){
          const ids2=r.stale.join(',');
          const follow=n=>setTimeout(()=>{
            api('/api/hot?ids='+encodeURIComponent(ids2)).then(r2=>{
              Object.assign(state.data,r2.sources||{});
              const c=$('#content'), sc=c.scrollTop; render(); c.scrollTop=sc;
              if((r2.stale||[]).length && n<3) follow(n+1); saveSnap();
            }).catch(()=>{});
          }, 3000);
          follow(1);
          if(!window._staleTip){ window._staleTip=1; toast('已显示上次内容，正在后台更新…'); }
        }
      })
      .catch(()=>{ grp.forEach(s=>{ (state.data[s.id]=state.data[s.id]||{}).error='本地服务无响应'; }); })
      .finally(()=>{ grp.forEach(s=>state.loading.delete(s.id));
        /* V8.0.0 流畅度：分批抓取时合并到下一帧渲染，避免一秒内连续多轮全量重画 */
        if(!window._rbRaf){ window._rbRaf=requestAnimationFrame(()=>{ window._rbRaf=0;
          const c=$('#content'), sc=c.scrollTop; renderSidebar(); render(); c.scrollTop=sc; }); }
        saveSnap(); });
  };
  return Promise.all(groups.map((g,i)=>one(g,i)));
}

/* ---------------- 聚合 ---------------- */
function aggregate(){
  const out=[];
  const isTopCat=(state.cat==='__top');   // M8.1：总排行只取每个源的前 3 名
  enabledInCat().forEach(s=>{
    const d=state.data[s.id]; if(!d||!d.items) return;
    const per=isTopCat?Math.min(3,d.items.length)
                      :Math.min(s.count||state.cfg.settings.perSource||30, d.items.length);
    const len=Math.max(1,d.items.length);
    d.items.slice(0,per).forEach((it,i)=>out.push(Object.assign({},it,{srcName:s.name,srcId:s.id,score:(1-i/len)*100})));
  });
  const seen=new Set(), list=[];
  out.forEach(it=>{ const k=it.title.replace(/[\s\W]+/g,'').slice(0,30); if(seen.has(k))return; seen.add(k); list.push(it); });
  if(state.cat==='__top'||state.cat==='__region'){
    // 总排行/本地：按阅读/评论/热度数值降序
    list.sort((a,b)=>(b.heat||0)-(a.heat||0)||(b.score-a.score));
  }
  else if(state.cfg.settings.sortAgg==='source') list.sort((a,b)=>(a.srcId<b.srcId?-1:1)||(b.score-a.score));
  else list.sort((a,b)=>(b.score-a.score)||((b.heat||0)-(a.heat||0)));
  return list.slice(0,320);
}

/* V6.7：GitHub 英文简介 → 中文（懒翻译，localStorage 缓存 hb_tr_zh，走本地 /api/translate） */
let _trC=null,_trBusy=false;
function trCache(){
  if(_trC) return _trC;
  try{ _trC=JSON.parse(localStorage.getItem('hb_tr_zh')||'{}'); }catch(e){ _trC={}; }
  if(!_trC||typeof _trC!=='object'||Array.isArray(_trC)) _trC={};
  return _trC;
}
/* V7.8.5：英文标题自动中文翻译（Argos 离线优先；缓存 hb_title_tr；只翻当前屏；GitHub 板块不参与） */
let _tC=null,_tBusy=false;
function tCache(){
  if(_tC) return _tC;
  try{ _tC=JSON.parse(localStorage.getItem('hb_title_tr')||'{}'); }catch(e){ _tC={}; }
  if(!_tC||typeof _tC!=='object'||Array.isArray(_tC)) _tC={};
  return _tC;
}
function tHash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36)+'_'+s.length; }
function isEnTitle(t){
  t=(t||'').trim();
  if(!/[A-Za-z]{3}/.test(t)) return false;
  const cjk=(t.match(/[\u3400-\u9fff\uf900-\ufaff]/g)||[]).length;
  return cjk===0 || (cjk/t.length)<0.15;   /* 中文占比高就不算英文标题 */
}
function titleTrOn(){ return (state.cfg.settings||{}).titleTrans!==false; }
/* 翻译行 HTML：有缓存直接带文字，否则输出空占位元素等批量回填；绝不改动英文原文 */
const _tIndex={};        /* hash -> 原始英文标题，供 DOM 扫描补翻时反查 */
function tTrHTML(it){
  if(!titleTrOn()) return '';
  if(/^https:\/\/github\.com\//.test(it.url||'')) return '';   /* GitHub 板块不参与（它有自己的简介翻译） */
  const t=(it.title||'').trim();
  if(!isEnTitle(t)) return '';
  const z=tCache()[t]||'';
  const h=tHash(t);
  _tIndex[h]=t;
  const inner=z?`${esc(z)}<span class="tr-tag">【(机翻)】</span>`:'';
  return `<span class="zh-tr" data-ttr="${h}">${inner}</span>`;
}
/* 渲染后收集当前屏未翻译的英文标题：排队（不丢），批量交给后端（缓存 → 离线模型 → 在线），
   回来的结果直接回填 DOM；一轮下来还有没翻成的，退避后再补两轮，避免「只翻前几条」。 */
let _tQ=[], _tRun=false, _tMiss=[], _tRound=0;
function tEnqueue(list){
  (list||[]).forEach(t=>{ if(t && _tQ.indexOf(t)<0 && _tMiss.indexOf(t)<0 && !tCache()[t]) _tQ.push(t); });
}
function collectTitleTr(items){
  if(!titleTrOn()) return;
  const add=[];
  (items||[]).forEach(it=>{
    if(!it||/^https:\/\/github\.com\//.test(it.url||'')) return;
    const t=(it.title||'').trim();
    if(isEnTitle(t)) add.push(t);
  });
  /* 兜底：直接扫页面上的空翻译占位（看板一次渲染的条目比聚合列表上限多，只靠 items 会漏） */
  document.querySelectorAll('#content .zh-tr').forEach(el=>{
    if(el.textContent.trim()) return;
    const t=_tIndex[el.dataset.ttr];
    if(t) add.push(t);
  });
  tEnqueue(add);
  if(_tQ.length) runTQueue();
}
async function tFetchChunk(chunk){
  try{
    const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({texts:chunk,engine:trEngineArg(),keys:pgTrKeys()})});
    const j=await r.json();
    return (j&&j.map)||{};
  }catch(e){ return {}; }
}
async function runTQueue(){
  if(_tRun||!titleTrOn()) return;
  _tRun=true;
  try{
    while(_tQ.length){
      const chunk=_tQ.splice(0,40);
      const mp=await tFetchChunk(chunk);
      const c2=tCache(); let hit=0;
      Object.keys(mp).forEach(k=>{ const v=String(mp[k]||'').trim(); if(k&&v&&v!==k){ c2[k]=v.slice(0,300); hit++; } });
      try{ const ks=Object.keys(c2); if(ks.length>3000) ks.slice(0,ks.length-3000).forEach(k=>delete c2[k]);
        localStorage.setItem('hb_title_tr',JSON.stringify(c2)); }catch(e){}
      if(hit){   /* 直接回填对应 DOM 节点，避免整页重绘闪烁 */
        chunk.forEach(t=>{
          const z=c2[t]; if(!z) return;
          const h=tHash(t);
          document.querySelectorAll('[data-ttr="'+h+'"]').forEach(el=>{
            el.innerHTML=esc(z)+'<span class="tr-tag">【(机翻)】</span>';
          });
        });
      }
      chunk.forEach(t=>{ if(!tCache()[t] && _tMiss.indexOf(t)<0) _tMiss.push(t); });
      if(_tQ.length) await new Promise(r=>setTimeout(r,120));
    }
  }catch(e){}
  finally{ _tRun=false; }
  /* 补翻：还有失败的，等 1.5s/3s 再补两轮（离线模型没装时在线接口偶尔限流，重试基本能补全） */
  _tMiss=_tMiss.filter(t=>!tCache()[t]);
  if(_tMiss.length && _tRound<2){
    _tRound++;
    const again=_tMiss.slice(0,80); _tMiss=_tMiss.filter(t=>again.indexOf(t)<0);
    setTimeout(()=>{ if(!titleTrOn()||_tRun) return; tEnqueue(again); if(_tQ.length) runTQueue(); }, 1500*_tRound);
  }else if(!_tMiss.length){
    _tRound=0;
  }
}
/* V6.9：一键翻译本页（模式：全中文/中英双显；引擎：谷歌/百度/有道，百度有道需密钥） */
let _pgTrC=null,_pgTrBusy=false;
function pgTrCache(){
  if(_pgTrC) return _pgTrC;
  try{ _pgTrC=JSON.parse(localStorage.getItem('hb_page_tr')||'{}'); }catch(e){ _pgTrC={}; }
  if(!_pgTrC||typeof _pgTrC!=='object'||Array.isArray(_pgTrC)) _pgTrC={};
  return _pgTrC;
}
function pgTrKeys(){ try{ const v=JSON.parse(localStorage.getItem('hb_trans_keys')||'{}'); return (v&&typeof v==='object')?v:{}; }catch(e){ return {}; } }
function pgTrMode(){ return (state.cfg.settings||{}).pageTrans||''; }
function pgTrEngine(){ return (state.cfg.settings||{}).transEngine||'google'; }
/* V7.9.7：翻译模型（自动 / 仅在线=关闭离线 / 仅离线）→ 传给后端的 engine 参数 */
function trEngineArg(){
  const md=(state.cfg.settings||{}).pageTrModel||'auto';
  if(md==='offline') return 'argos';
  if(md==='online') return pgTrEngine();
  return 'auto';
}
function pgTrOf(it){ return pgTrCache()[it.title]||''; }
function trTitleHTML(it){
  const m=pgTrMode();
  if(!m) return esc(titleOf(it));
  const z=pgTrOf(it);
  if(m==='zh') return `<span title="${esc(it.title)}">${esc(z||it.title)}</span>`;
  return z?`${esc(titleOf(it))}<span class="cntr">${esc(z)}</span>`:esc(titleOf(it));
}
function collectPageTr(items){
  const m=pgTrMode(); if(!m||_pgTrBusy) return;
  const c0=pgTrCache(); const all=[];
  (items||[]).forEach(it=>{ if(it&&it.title&&!(it.title in c0)&&all.indexOf(it.title)<0) all.push(it.title); });
  if(!all.length) return;
  _pgTrBusy=true;
  const btn=$('#btnTr'), tot=all.length, CH=40; let done=0;   /* M5.5/V7.2：每批 40 条循环补齐，不再一批封顶 */
  (async()=>{
    try{
      for(let i=0;i<all.length;i+=CH){
        const chunk=all.slice(i,i+CH);
        let mp={};
        try{
          const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({texts:chunk,engine:trEngineArg(),keys:pgTrKeys()})});
          const j=await r.json(); mp=(j&&j.map)||{};
        }catch(e){}
        const c=pgTrCache();
        Object.keys(mp).forEach(k=>{ const v=String(mp[k]||'').trim(); if(k&&v){ c[k]=v.slice(0,300); } });
        /* M5.5/V7.2：常规引擎漏翻的条目，云端 LLM 一批兜底补齐 */
        const missing=chunk.filter(k=>!(k in c));
        if(missing.length&&typeof ensureCloud==='function'&&ensureCloud()){
          try{
            const z=await llmTrBatch(missing);
            if(z) Object.keys(z).forEach(k=>{ const v=String(z[k]||'').trim(); if(k&&v){ c[k]=v.slice(0,300); } });
          }catch(e){}
        }
        done+=chunk.length;
        if(btn) btn.title='一键翻译本页（进行中 '+done+'/'+tot+'）';
        try{ const ks=Object.keys(c); if(ks.length>2000) ks.slice(0,ks.length-2000).forEach(k=>delete c[k]);
          localStorage.setItem('hb_page_tr',JSON.stringify(c)); }catch(e){}
        render();
        await new Promise(r=>setTimeout(r,300));
      }
    }catch(e){}
    finally{ _pgTrBusy=false; if(btn) btn.title='一键翻译本页'; }
  })();
}
/* M5.5/V7.2：云端 LLM 批量翻译兜底（一次补一批标题） */
async function llmTrBatch(texts){
  if(typeof CLOUD==='undefined'||!CLOUD||!CLOUD.llm) return null;
  let mid='';
  try{ const ls=await CLOUD.llm.models.list();
    mid=((Array.isArray(ls)&&ls[0]&&(ls[0].id||ls[0].name))||(((ls||{}).data)||[]).map(x=>x&&x.id).find(Boolean)||'');
  }catch(e){ return null; }
  if(!mid) return null;
  const prompt='把 JSON 数组里的每条新闻标题翻译成简体中文。只返回一个 JSON 对象：键=原文，值=中文译文。不要解释、不要输出其他文字。数组：'+JSON.stringify(texts);
  let out='';
  const stream=await CLOUD.llm.chat.completions.create({model:mid,stream:true,messages:[{role:'user',content:prompt}]});
  for await(const ch of stream){ const d=(ch&&ch.choices&&ch.choices[0]&&ch.choices[0].delta)||{}; if(d.content) out+=d.content; }
  const mm=out.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').match(/\{[\s\S]*\}/);
  if(!mm) return null;
  const o=JSON.parse(mm[0]); const r={};
  (texts||[]).forEach(t=>{ if(typeof o[t]==='string'&&o[t].trim()) r[t]=o[t]; });
  return r;
}

function isGh(it){ return !!it && /^https:\/\/github\.com\//.test(it.url||'') && !!(it.desc||'').trim(); }
function ghZh(it){ if(!isGh(it)) return ''; return trCache()[it.desc.trim()]||''; }
function ghZhHTML(it){ const z=ghZh(it); return z?`<span class="ghzh">&emsp;${esc(z)}</span>`:''; }
async function translateGh(list){
  const c=trCache(), need=[];
  (list||[]).forEach(it=>{ if(!isGh(it)) return; const d=it.desc.trim(); if(d && !(d in c) && need.indexOf(d)<0) need.push(d); });
  if(!need.length||_trBusy) return;
  _trBusy=true;
  try{
    let got=0;
    for(let i=0;i<need.length;i+=20){
      const batch=need.slice(i,i+20);
      try{
        const r=await fetch('/api/translate?texts='+encodeURIComponent(JSON.stringify(batch)),{cache:'no-store'});
        const j=await r.json();
        const m=(j&&j.map)||{};
        Object.keys(m).forEach(k=>{ const v=String(m[k]||'').trim(); if(k&&v&&v!==k){ c[k]=v.slice(0,160); got++; } });
      }catch(e){ break; }
    }
    if(got){
      try{ const ks=Object.keys(c); if(ks.length>800) ks.slice(0,ks.length-800).forEach(k=>delete c[k]);
        localStorage.setItem('hb_tr_zh',JSON.stringify(c)); }catch(e){}
      render();   // 缓存命中后 need 为空，不会死循环
    }
  }catch(e){ /* 翻译失败静默 */ }
  finally{ _trBusy=false; }
}

function currentList(){
  if(state.view==='fav') return state.favs.map((f,i)=>Object.assign({},f,{rank:i+1,srcName:f.src,_i:i})).filter(match);
  if(state.view==='hist') return state.hist.map((f,i)=>Object.assign({},f,{rank:i+1,srcName:f.src,_i:i})).filter(match);
  if(state.view==='all') return aggregate().filter(match).map((it,i)=>{it._i=i;return it;});
  const s=state.cfg.sources.find(x=>x.id===state.view);
  const d=state.data[state.view]||{};
  const per=s?Math.min(s.count||30,999):30;
  return (d.items||[]).filter(match).slice(0,per).map((it,i)=>{it._i=i;return it;});
}

/* 分类导航渲染
   V7.9：分类页签改用指针拖拽——按住页签左右拖=排序，拖到「🚫」=隐藏，拖到「🗑」=删除；
   源行拖到页签上=换分组（在 bindSidebarDrag 的 targets 里处理）。 */
function bindCatsDrag(box){
  ptrSort(box,{item:'button[data-c]',axis:'x',
    canDrag:item=>!['全部','__top'].includes(item.dataset.c),
    onStart:()=>{ const h=$('#catHideDrop'),d=$('#catDelDrop');
      if(h) h.style.display='inline-block'; if(d) d.style.display='inline-block'; },
    onEnd:()=>{ const h=$('#catHideDrop'),d=$('#catDelDrop');
      if(h) h.style.display='none'; if(d) d.style.display='none'; },
    targets:[
      {sel:'#catHideDrop', onDrop:(dz,item)=>{
        const c=item.dataset.c;
        if(['全部','__top'].includes(c)) return;
        if(c===PROTECT_CAT){ toast('「推广」是广告分类，不能隐藏，只能调整排序'); return; }
        if(c==='__region'){
          setHiddenCat('本地',true); saveCfg(); renderCats(); renderSidebar();
          if($('#mask')&&$('#mask').classList.contains('on')) renderModal();
          render(); toast('已隐藏「本地」，在 设置→新闻源→分类管理 可恢复'); return;
        }
        setHiddenCat(c,true); saveCfg(); renderCats(); renderSidebar();
        if($('#mask')&&$('#mask').classList.contains('on')) renderModal();
        render(); toast('已隐藏「'+c+'」，在 设置→新闻源→分类管理 可恢复'); }},
      {sel:'#catDelDrop', onDrop:(dz,item)=>{
        const c=item.dataset.c;
        if(c===PROTECT_CAT){ toast('「推广」是广告分类，不能删除，只能调整排序'); return; }
        if(c==='__region'){ if(!confirm('删除「本地」分类？已设置的地区会被清空（之后可在设置里重新填写）。')) return; clearRegion(); return; }
        if(c==='综合'){ toast('「综合」是基础分类，不能删除'); return; }
        if(!c||['全部','__top','__region'].includes(c)) return;
        if(!confirm('删除分类「'+c+'」？里面的源会移回「综合」，源本身不删。')) return;
        const cs=(state.cfg.settings.cats=state.cfg.settings.cats||[]);
        const i=cs.indexOf(c); if(i>=0) cs.splice(i,1);
        state.cfg.sources.forEach(s=>{ if(catHas(s,c)) setSrcCats(s,srcCats(s).filter(x=>x!==c)); });
        const hid=(state.cfg.settings.hideCats=state.cfg.settings.hideCats||[]);
        const hi=hid.indexOf(c); if(hi>=0) hid.splice(hi,1);
        if(state.cat===c) state.cat='全部';
        saveCfg(); renderCats(); renderSidebar();
        if($('#mask')&&$('#mask').classList.contains('on')) renderModal();
        render(); toast('已删除分类「'+c+'」，其中的源已移回「综合」'); }}
    ],
    onDrop:(d,t,before)=>{
      const from=d.dataset.c, to=t.dataset.c;
      if(!from||!to||from===to||from==='全部') return;
      const cs=state.cfg.settings.cats;
      if(!cs||cs.indexOf(from)<0) return;
      cs.splice(cs.indexOf(from),1);
      let j;
      if(to==='全部') j=0;                              // V7.9.1：拖到最左「全部」= 排到最前
      else if(to==='__region'||to==='__top') j=cs.length;  // 拖到右侧固定页签 = 排到最后
      else {
        const k=cs.indexOf(to);
        if(k<0){ cs.splice(0,0,from); saveCfg(); renderCats(); render(); return; }
        j=before?k:k+1;
      }
      cs.splice(j,0,from);
      saveCfg(); renderCats(); render(); toast('已把「'+from+'」排到第 '+(j+1)+' 位');
    }
  });
}
/* V7.9.1：分类页签「左移/右移」按钮（选中页签时出现；单击必定生效，不依赖拖拽） */
function moveCatStep(c,dir){
  const cs=(state.cfg.settings.cats||[]).slice();
  const i=cs.indexOf(c); if(i<0) return;
  const j=i+dir;
  if(j<0||j>=cs.length){ toast(dir<0?'已经是最左边了':'已经是最右边了'); return; }
  cs.splice(j,0,cs.splice(i,1)[0]);
  state.cfg.settings.cats=cs;
  saveCfg(); refreshCats(); renderCats(); renderSidebar();
  if($('#mask')&&$('#mask').classList.contains('on')) renderModal();
  render();
  toast('已'+(dir<0?'左移':'右移')+'「'+c+'」（第 '+(j+1)+' 位）');
}
function renderCats(){
  if(window._ptrDragging){ window._ptrDefer=1; return; }   /* V8.0.8：拖动分类时不要重建 */
  const box=$('#catRow'); if(!box) return;
  bindCatsDrag(box);
  // 自愈：隐藏清单可能包含正在看的分类 → 回退「全部」
  if(state.cat!=='__top' && state.cat!=='__region' && visibleCatsList().indexOf(state.cat)<0) state.cat='全部';
  const shown = enabled();
  /* V8.0.5：已隐藏分类不再占位；可用源为 0 的分类也收起（当前选中的分类始终保留，方便调整顺序） */
  const _cnt = c => c==='全部' ? shown.length : shown.filter(s=>catHas(s,c)).length;
  const _hidN=hiddenCats().filter(c=>catsOnly().indexOf(c)>=0).length
    + ((typeof hasRegion==='function'&&hasRegion()&&hiddenCats().indexOf('本地')>=0)?1:0);
  box.innerHTML = visibleCatsList().filter(c=>{
    if(c==='全部' || state.cat===c) return true;
    return _cnt(c) > 0;
  }).map(c=>{
    const n = _cnt(c);
    const mv = (state.cat===c && c!=='全部')
      ? `<i class="cmv" data-cmv="-1" title="左移一位（调整分类顺序）">‹</i><i class="cmv" data-cmv="1" title="右移一位（调整分类顺序）">›</i>`
      : '';
    return `<button data-c="${c}" class="${state.cat===c?'on':''}" title="${c==='全部'?'全部分类':'可把源行拖到这里换分组；选中后出现 ‹ › 可左右移动排序'}">${c}<em>${n}</em>${mv}</button>`;
  }).join('')
    + (_hidN>0 ? `<button data-c="__hidden" class="${state.cat==='__hidden'?'on':''}" title="查看已隐藏的分类：可恢复显示或彻底删除">🚫 已隐藏 ${_hidN}</button>` : '')
    + (regionVisible() ? `<button data-c="__region" class="${state.cat==='__region'?'on':''}" title="使用者设置的本地（省/市），在设置里添加；可在 设置→分类管理 隐藏/删除">本地</button>` : '')
    + `<span id="catHideDrop" style="display:none;flex:none;align-self:center;padding:2px 10px;border-radius:8px;font-size:12px;color:#fff;background:#e04438;opacity:.85">🚫 松手隐藏该分类</span>`
    + `<span id="catDelDrop" style="display:none;flex:none;align-self:center;padding:2px 10px;border-radius:8px;font-size:12px;color:#fff;background:#7a1f1f;opacity:.85;margin-left:8px">🗑 松手删除该分类</span>`;
  box.querySelectorAll('button').forEach(b=>{
    b.onclick=e=>{
      /* V8.0.8：刚拖动完分类的那一下松手不算点击，避免拖完顺手切了分类 */
      if(window._ptrJustDropped && Date.now()-window._ptrJustDropped<350) return;
      const mvBtn=e.target.closest&&e.target.closest('[data-cmv]');
      if(mvBtn){ e.preventDefault(); e.stopPropagation(); moveCatStep(b.dataset.c,parseInt(mvBtn.dataset.cmv,10)); return; }
      if(b.dataset.c==='__hidden'){ openHiddenCats(); return; }   // V8.0.6：已隐藏分类管理
      state.cat=b.dataset.c; state.view='all'; state.layout='board'; renderCats(); renderSidebar(); render();   // 点分类立即切到该分类的总览看板
    };
  });
}

/* V8.0.6：已隐藏分类管理弹层——侧边栏/顶部分类条直接恢复显示或删除，
   与 设置→分类管理 的隐藏专区同一套动作（恢复时连带开启该分类的源） */
function openHiddenCats(){
  document.querySelectorAll('.hidov').forEach(n=>n.remove());
  const ov=el('div','hidov');
  ov.style.cssText='position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px';
  const card=el('div');
  card.style.cssText='background:var(--card,#fff);color:var(--text,#222);border-radius:14px;max-width:520px;width:100%;max-height:78vh;overflow:auto;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)';
  ov.appendChild(card);
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  const render=()=>{
    const hid=hiddenCats();
    const list=catsOnly().filter(c=>hid.indexOf(c)>=0);
    const locHid=(typeof hasRegion==='function'&&hasRegion()&&hid.indexOf('本地')>=0);
    card.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <b style="font-size:15px">🚫 已隐藏的分类（${list.length+(locHid?1:0)}）</b>
        <button class="mini" data-x style="padding:2px 10px">✕ 关闭</button></div>
      <div style="font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:10px">
        这些分类不显示在导航栏、里面的源不抓取。点「恢复显示」回到导航栏并开启该分类的源；点「删除」把分类连同源一起移除。</div>`
      +(locHid?`<div class="hrow" data-c="本地" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--sub) 10%,transparent);margin-bottom:6px">
          <b style="flex:1;font-size:13px">本地</b>
          <button class="mini" data-show="本地" style="padding:3px 10px">👁 恢复显示</button>
          <button class="mini danger" data-hdel="本地" style="padding:3px 10px">🗑 删除</button></div>`:'')
      +(list.length?list.map(c=>{
          const n=state.cfg.sources.filter(s=>catHas(s,c)).length;
          return `<div class="hrow" data-c="${esc(c)}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--sub) 10%,transparent);margin-bottom:6px">
